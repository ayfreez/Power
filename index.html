<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PowerLog"/>
  <meta name="theme-color" content="#020817"/>
  <title>PowerLog</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;
      overflow:hidden;
      background:#020817;
      font-family:-apple-system,system-ui,sans-serif;
      color:#e2e8f0;
      overscroll-behavior:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    #app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;overflow:hidden}
    #safe-top{flex-shrink:0;height:env(safe-area-inset-top);min-height:env(safe-area-inset-top);background:#020817}
    #safe-bottom{flex-shrink:0;height:env(safe-area-inset-bottom);min-height:env(safe-area-inset-bottom);background:#020817}

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar{width:2px}
    ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}

    /* ── INPUTS ── */
    input[type=number]{-moz-appearance:textfield;outline:none}
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type=date]{color-scheme:dark}

    /* ── ANIMATIONS ── */
    @keyframes pulse{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    .page{animation:fadeup .18s ease}

    /* ── LAYOUT ── */
    #header{
      flex-shrink:0;
      background:#020817;
      border-bottom:1px solid #0f172a;
      padding:10px 16px 10px;
      display:flex;align-items:center;justify-content:space-between;
    }
    #content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
    #inner{max-width:560px;margin:0 auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}

    /* ── NAV ── */
    #bottomnav{
      flex-shrink:0;
      background:#020817;
      border-top:1px solid #0f172a;
      display:flex;
    }
    .nav-btn{
      flex:1;background:transparent;border:none;
      padding:8px 0 6px;
      display:flex;flex-direction:column;align-items:center;gap:2px;
      cursor:pointer;
    }
    .nav-btn span:first-child{font-size:18px}
    .nav-btn span:last-child{font-size:9px;letter-spacing:.5px;font-weight:500;text-transform:uppercase}

    /* ── CARDS ── */
    .card{
      background:#0b1628;
      border:1px solid #0f172a;
      border-radius:16px;
      padding:14px;
      margin-bottom:10px;
    }
    .card-inner{
      background:#020817;
      border:1px solid #0f172a;
      border-radius:10px;
      padding:10px;
      margin-top:8px;
    }

    /* ── BUTTONS ── */
    button{cursor:pointer;font-family:inherit;-webkit-appearance:none;border:none;background:none}

    /* ── SECTION LABELS ── */
    .section-label{
      font-size:9px;font-weight:700;
      letter-spacing:1.5px;text-transform:uppercase;
      color:#334155;margin-bottom:8px;
    }

    /* ── BADGES ── */
    .badge{
      display:inline-flex;align-items:center;
      border-radius:6px;padding:2px 8px;
      font-size:10px;font-weight:700;
      border:1px solid;
    }

    /* ── EXERCISE CARDS ── */
    .ex-card{
      background:#0b1628;
      border:1px solid #0f172a;
      border-radius:14px;
      margin-bottom:10px;
      overflow:hidden;
    }
    .ex-header{
      padding:12px 14px;
      border-bottom:1px solid #0f172a;
      display:flex;align-items:flex-start;justify-content:space-between;
    }
    .ex-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}

    /* ── INPUTS STYLED ── */
    .input-weight{
      width:100%;
      background:#020817;
      border:1px solid #1e293b;
      border-radius:12px;
      color:#fff;
      padding:10px 14px;
      font-size:22px;font-weight:800;
      font-family:inherit;
      outline:none;
      transition:border-color .15s;
    }
    .input-weight:focus{border-color:#6366f1}

    /* ── RPE BUTTONS ── */
    .rpe-btn{
      padding:5px 7px;
      border-radius:7px;
      font-size:11px;font-weight:700;
      transition:all .1s;
      border:1px solid;
    }

    /* ── WEEK PILLS ── */
    .week-pill{
      flex-shrink:0;
      border-radius:9px;
      padding:6px 10px;
      font-size:10px;
      text-align:center;
      border:1px solid;
      cursor:pointer;
    }

    /* ── DAY TABS ── */
    .day-tab{
      flex-shrink:0;
      border-radius:10px;
      padding:8px 14px;
      font-size:12px;font-weight:600;
      border:1px solid;
      cursor:pointer;
    }

    /* ── FEEDBACK STRIP ── */
    .feedback{
      padding:6px 10px;
      border-radius:7px;
      font-size:11px;
      border-left:2px solid;
    }

    /* ── SUGGESTION BOX ── */
    .sugg-box{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;
      border-radius:10px;
      background:#0d1a2e;
      border:1px solid #1e3a5f;
    }

    /* ── PLATE CHIPS ── */
    .plate-chip{
      display:inline-flex;align-items:center;
      padding:2px 6px;
      border-radius:4px;
      font-size:10px;font-weight:800;
      color:#fff;
    }

    /* ── TIMER WIDGET ── */
    #timer-widget{
      position:fixed;
      bottom:calc(62px + env(safe-area-inset-bottom));
      left:50%;transform:translateX(-50%);
      background:#0b1628;
      border:1px solid #6366f1;
      border-radius:40px;
      padding:8px 14px 8px 10px;
      z-index:90;
      display:none;
      align-items:center;gap:10px;
      box-shadow:0 8px 32px rgba(99,102,241,.2);
      animation:fadein .2s ease;
    }

    /* ── HISTORY ROWS ── */
    .hist-ex-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:4px 0;
      border-top:1px solid #0f172a;
      font-size:11px;gap:6px;
    }

    /* ── GRAPH SVG ── */
    .graph-wrap{width:100%;overflow:hidden;border-radius:8px}
  </style>
</head>
<body>
<div id="app">

  <!-- SAFE AREA TOP -->
  <div id="safe-top"></div>

  <!-- LOADING -->
  <div id="loading" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
    <div style="font-size:26px;font-weight:900;letter-spacing:-0.5px">
      <span style="color:#6366f1">Power</span><span style="color:#f1f5f9">Log</span>
    </div>
    <div style="display:flex;gap:5px">
      <div style="width:6px;height:6px;border-radius:50%;background:#6366f1;animation:pulse 1s 0s infinite ease-in-out"></div>
      <div style="width:6px;height:6px;border-radius:50%;background:#6366f1;animation:pulse 1s .2s infinite ease-in-out"></div>
      <div style="width:6px;height:6px;border-radius:50%;background:#6366f1;animation:pulse 1s .4s infinite ease-in-out"></div>
    </div>
    <div style="font-size:9px;color:#1e293b;letter-spacing:2px;font-weight:600">CHARGEMENT</div>
  </div>

  <!-- MAIN (hidden until ready) -->
  <div id="main" style="display:none;flex-direction:column;flex:1;overflow:hidden">

    <!-- HEADER -->
    <div id="header">
      <div onclick="goTab('profile')" style="cursor:pointer">
        <div style="font-size:18px;font-weight:900;letter-spacing:-0.5px;line-height:1">
          <span style="color:#6366f1">Power</span><span style="color:#f1f5f9">Log</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;margin-top:2px">
          <div style="width:4px;height:4px;border-radius:50%;background:#22c55e;box-shadow:0 0 4px #22c55e"></div>
          <span style="font-size:8px;color:#334155;letter-spacing:1px;font-weight:600">LOCAL STORAGE</span>
        </div>
      </div>
      <div id="header-status"></div>
    </div>

    <!-- CONTENT -->
    <div id="content">
      <div id="inner">
        <div id="tab-profile" class="page" style="display:none"></div>
        <div id="tab-blocks" class="page"></div>
        <div id="tab-session" class="page" style="display:none"></div>
        <div id="tab-weight" class="page" style="display:none"></div>
        <div id="tab-history" class="page" style="display:none"></div>
        <div id="tab-settings" class="page" style="display:none"></div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div id="bottomnav">
      <button class="nav-btn" onclick="goTab('profile')" id="nav-profile">
        <span>👤</span><span>Profil</span>
      </button>
      <button class="nav-btn" onclick="goTab('blocks')" id="nav-blocks">
        <span>🧱</span><span>Programme</span>
      </button>
      <button class="nav-btn" onclick="goTab('session')" id="nav-session">
        <span>🏋️</span><span>Séance</span>
      </button>
      <button class="nav-btn" onclick="goTab('weight')" id="nav-weight">
        <span>⚖️</span><span>Poids</span>
      </button>
      <button class="nav-btn" onclick="goTab('history')" id="nav-history">
        <span>📊</span><span>Historique</span>
      </button>
      <button class="nav-btn" onclick="goTab('settings')" id="nav-settings">
        <span>⚙️</span><span>Config</span>
      </button>
    </div>
  </div>

  <!-- REST TIMER WIDGET (floating) -->
  <div id="timer-widget">
    <div style="position:relative;width:38px;height:38px;flex-shrink:0">
      <svg width="38" height="38" style="transform:rotate(-90deg)">
        <circle cx="19" cy="19" r="15" fill="none" stroke="#1e293b" stroke-width="2.5"/>
        <circle id="timer-ring" cx="19" cy="19" r="15" fill="none" stroke="#6366f1" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="0"
          style="transition:stroke-dashoffset .5s linear"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#6366f1;font-family:monospace" id="timer-display">2:00</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button onclick="toggleTimerPlayPause()" id="timer-playpause"
        style="background:#6366f1;color:#fff;width:28px;height:28px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0">⏸</button>
      <button onclick="addTimerSeconds(15)"
        style="background:#0f172a;color:#6366f1;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid #1e293b">+15s</button>
      <button onclick="stopTimer()" style="color:#334155;font-size:14px;padding:2px 4px">✕</button>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-overlay" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.88);z-index:100;align-items:flex-end;justify-content:center" onclick="closeModal()">
    <div id="modal-box" style="background:#0b1628;border-top:1px solid #1e293b;border-left:1px solid #1e293b;border-right:1px solid #1e293b;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- SAFE AREA BOTTOM -->
  <div id="safe-bottom"></div>

</div>

<script>
// ── RPE TABLE ────────────────────────────────────────────────────────────────
const RT = {
  1:{10:1.000,9.5:0.978,9:0.956,8.5:0.939,8:0.922,7.5:0.907,7:0.892,6.5:0.878,6:0.863},
  2:{10:0.955,9.5:0.939,9:0.922,8.5:0.907,8:0.892,7.5:0.878,7:0.863,6.5:0.850,6:0.837},

  6:{10:0.837,9.5:0.824,9:0.811,8.5:0.798,8:0.785,7.5:0.773,7:0.762,6.5:0.750,6:0.738},
  7:{10:0.811,9.5:0.798,9:0.785,8.5:0.773,8:0.762,7.5:0.750,7:0.738,6.5:0.727,6:0.714},
  8:{10:0.785,9.5:0.773,9:0.762,8.5:0.750,8:0.738,7.5:0.727,7:0.714,6.5:0.702,6:0.690},
  9:{10:0.762,9.5:0.750,9:0.738,8.5:0.727,8:0.714,7.5:0.702,7:0.690,6.5:0.680,6:0.668},
  10:{10:0.738,9.5:0.727,9:0.714,8.5:0.702,8:0.690,7.5:0.680,7:0.668,6.5:0.656,6:0.645},
};
function calcE1RM(w,r,rpe){
  const row=RT[Math.min(Math.round(r),10)];
  if(!row)return w;
  const p=row[Math.round(rpe*2)/2];
  return p?Math.round(w/p):w;
}
function calcSuggest(e1rm,r,rpe){
  const row=RT[Math.min(Math.round(r),10)];
  if(!row)return null;
  const p=row[Math.round(rpe*2)/2];
  return p?Math.round((e1rm*p)/2.5)*2.5:null;
}

const RPE_COLOR={6:"#22c55e",6.5:"#22c55e",7:"#86efac",7.5:"#eab308",8:"#f97316",8.5:"#ef4444",9:"#dc2626",9.5:"#991b1b",10:"#7f1d1d"};
const RPE_LABEL={6:"Très facile",6.5:"Facile",7:"Modéré",7.5:"Confortable",8:"Difficile",8.5:"Très difficile",9:"Presque max",9.5:"Max-1",10:"Maximum"};
const rpeC=r=>RPE_COLOR[r]||"#94a3b8";
const LEVEL_COLOR={Débutant:"#22c55e",Intermédiaire:"#eab308",Avancé:"#ef4444",Spécial:"#a855f7","Mon Programme":"#6366f1"};

// ── BLOCKS ───────────────────────────────────────────────────────────────────
const BLOCKS = [
  // ── BLOCS PERSONNALISÉS ───────────────────────────────────────────────────
  {id:"perso_reprise",emoji:"🔄",name:"PHASE 1 — REPRISE",inspo:"Programme personnalisé · 26 ans · 115kg",color:"#22c55e",weeks:8,level:"Mon Programme",
   desc:"Bloc de reprise sur mesure après 2 ans d'arrêt. Objectif : retrouver les sensations, réhabituer le corps aux charges, exploiter la mémoire musculaire. Toujours 3-4 reps en réserve, aucune série à l'échec. RPE 6 = très facile, c'est voulu.",
   notes:"🎯 Objectif : technique parfaite + retrouver les sensations\n📹 Filme tes séries de squat, bench et deadlift régulièrement\n🚶 8 000 à 10 000 pas par jour si possible\n🥗 Déficit calorique léger — cible 0.3 à 0.8kg/semaine",
   days:[
     {name:"Jour 1",label:"Squat / Bench",exs:[{l:"Squat",s:4,r:5,rpe:6},{l:"Bench Press",s:4,r:5,rpe:6},{l:"Panata Super Rowing",s:3,r:8,rpe:6}]},
     {name:"Jour 2",label:"DL / Bench serré",exs:[{l:"Deadlift",s:3,r:5,rpe:6},{l:"Bench Serré",s:3,r:6,rpe:6},{l:"Tirage Vertical",s:3,r:8,rpe:6},{l:"Face Pull",s:3,r:15,rpe:6}]},
     {name:"Jour 3",label:"Squat pause / Bench",exs:[{l:"Squat Pause",s:3,r:4,rpe:6},{l:"Bench Press",s:5,r:4,rpe:6},{l:"Romanian DL",s:2,r:8,rpe:6},{l:"Gainage",s:3,r:1,rpe:6}]},
   ],

  {id:"perso_transition",emoji:"⚡",name:"PHASE 2 — TRANSITION PL",inspo:"Programme personnalisé · Semaine 7-9",color:"#f59e0b",weeks:6,level:"Mon Programme",

     {name:"Jour 1",label:"Squat top single",exs:[{l:"Squat",s:1,r:1,rpe:7},{l:"Squat",s:4,r:5,rpe:7},{l:"Bench Press",s:3,r:5,rpe:6}]},
     {name:"Jour 2",label:"Bench top single",exs:[{l:"Bench Press",s:1,r:1,rpe:7},{l:"Bench Press",s:5,r:5,rpe:7},{l:"Deadlift",s:3,r:4,rpe:6}]},

   ],
   wp:[{lbl:"Intro",ro:0,vm:0.8},{lbl:"Vol.",ro:0,vm:1},{lbl:"Vol.+",ro:0.5,vm:1},{lbl:"Surcharge",ro:0.5,vm:1.1},{lbl:"Intens.",ro:0.5,vm:0.9},{lbl:"Deload",ro:-2,vm:0.5}]},

  {id:"perso_intens",emoji:"🔥",name:"PHASE 3B — INTENSIFICATION",inspo:"Programme personnalisé · Bloc 2",color:"#f97316",weeks:4,level:"Mon Programme",

     {name:"Jour 1",label:"Squat / Bench",exs:[{l:"Squat",s:4,r:4,rpe:7.5},{l:"Bench Press",s:4,r:4,rpe:7.5},{l:"Deadlift",s:2,r:3,rpe:7}]},

   wp:[{lbl:"Transition",ro:0,vm:1},{lbl:"Intens.",ro:0.5,vm:0.9},{lbl:"Intens.+",ro:1,vm:0.8},{lbl:"Deload",ro:-2,vm:0.5}]},

  {id:"perso_peak",emoji:"🔺",name:"PHASE 3C — PEAK",inspo:"Programme personnalisé · Bloc 3",color:"#ef4444",weeks:3,level:"Mon Programme",
   desc:"Singles lourds, volume réduit. Préparation à un test de max ou à une compétition. 2-3 semaines seulement. Chaque séance compte.",

function getParentE1rm(lift){
  const rel = EXERCISE_RELATIONS[lift];
  if(!rel) return null;
  if(!rel.parent || !rel.ratio) return null; // exercice au poids du corps
  const parentE1rm = STATE.e1rms[rel.parent] || null;
  const lastParent = getLastData(rel.parent);
  const parentFromHistory = lastParent
    ? calcE1RM(lastParent.weight, lastParent.reps||5, lastParent.actualRpe)
    : null;
  const bestParent = Math.max(parentE1rm||0, parentFromHistory||0);
  if(!bestParent) return null;
  return { e1rm: bestParent, ratio: rel.ratio, parent: rel.parent, note: rel.note };
}

function getSugg(ex){
  // 1. Cherche dans l'historique de CET exercice précis (priorité)
  const last = getLastData(ex.lift);
  if(last){
    return calcSuggest(calcE1RM(last.weight, last.reps||ex.reps, last.actualRpe), ex.reps, ex.targetRpe);
  }

  // 2. Cherche le e1RM direct de cet exercice
  if(STATE.e1rms[ex.lift]){
    return calcSuggest(STATE.e1rms[ex.lift], ex.reps, ex.targetRpe);
  }

  // 3. Calcule depuis le mouvement parent si c'est un accessoire
  const parentData = getParentE1rm(ex.lift);
  if(parentData){
    const derivedE1rm = Math.round(parentData.e1rm * parentData.ratio);
    return calcSuggest(derivedE1rm, ex.reps, ex.targetRpe);
  }

  return null;
}

function getSuggInfo(ex){
  // Retourne des infos sur d'où vient la suggestion (pour affichage)
  const last = getLastData(ex.lift);
  if(last) return { source:"historique", label:null };
  if(STATE.e1rms[ex.lift]) return { source:"e1rm", label:null };
  const parentData = getParentE1rm(ex.lift);
  if(parentData) return {
    source:"parent",
    label:`Calculé depuis ${parentData.parent} × ${Math.round(parentData.ratio*100)}%`,
    note: parentData.note,
  };
  return { source:"none", label:null };
}

// ── PLATE CALCULATOR ─────────────────────────────────────────────────────────
// Plaques dispo (kg) — standard powerlifting, barre olympique 20kg
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
const PLATE_COLORS = {25:"#dc2626",20:"#3b82f6",15:"#eab308",10:"#22c55e",5:"#e5e7eb",2.5:"#0f172a",1.25:"#9ca3af"};
const BAR_WEIGHT = 20;

function calcPlates(totalWeight){
  const w = parseFloat(totalWeight);
  if(!w || w <= BAR_WEIGHT) return null;
  let perSide = (w - BAR_WEIGHT) / 2;
  if(perSide <= 0) return null;
  const result = [];
  for(const p of PLATES){
    while(perSide >= p - 0.001){
      result.push(p);
      perSide -= p;
    }
  }
  const remainder = Math.round(perSide*100)/100;
  return { plates: result, remainder, exact: remainder < 0.01 };
}

function plateCalcHTML(weight){
  const calc = calcPlates(weight);
  if(!calc) return "";
  if(calc.plates.length === 0) return `<div style="font-size:10px;color:#475569">Barre seule (${BAR_WEIGHT}kg)</div>`;
  const chips = calc.plates.map(p=>{
    const c = PLATE_COLORS[p]||"#475569";
    const textColor = (p===5||p===1.25) ? "#0b1628" : "#fff";
    return `<span style="background:${c};color:${textColor};border-radius:5px;padding:3px 7px;font-size:11px;font-weight:700;display:inline-block;margin:2px">${p}</span>`;
  }).join("");
  const warn = !calc.exact ? `<span style="color:#ef4444;font-size:9px;margin-left:6px">(reste ${calc.remainder}kg non chargeable)</span>` : "";
  return `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">
    <span style="font-size:9px;color:#475569;margin-right:6px">Par côté:</span>${chips}${warn}
  </div>`;
}

// ── REST TIMER ────────────────────────────────────────────────────────────────
let TIMER = { running:false, seconds:0, interval:null, duration:120, endTime:null };
let TIMER_AUDIO = null; // Audio object prêt à jouer, créé au tap

// Génère un son WAV de bips en JS pur et retourne un objet Audio
function makeBeepAudio(){
  const sampleRate = 44100;
  const bips = [
    {freq:880,  start:0,    dur:0.2},
    {freq:880,  start:0.28, dur:0.2},
    {freq:1100, start:0.56, dur:0.5},
  ];
  const totalSamples = Math.ceil(sampleRate * 1.2);
  const buf = new Float32Array(totalSamples);
  bips.forEach(({freq, start, dur})=>{
    const s0 = Math.floor(start * sampleRate);
    const s1 = Math.floor((start + dur) * sampleRate);
    for(let i = s0; i < s1 && i < totalSamples; i++){
      const t = (i - s0) / sampleRate;
      const env = Math.min(t / 0.01, 1) * Math.max(1 - (t - dur + 0.05) / 0.05, 0);
      buf[i] += Math.sin(2 * Math.PI * freq * t) * 0.7 * env;
    }
  });
  // Encode en WAV 16-bit
  const len = buf.length;
  const ab = new ArrayBuffer(44 + len * 2);
  const view = new DataView(ab);
  const writeStr = (o, s) => { for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4, 36+len*2, true);
  writeStr(8,'WAVE'); writeStr(12,'fmt ');
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true);
  view.setUint16(32,2,true); view.setUint16(34,16,true);
  writeStr(36,'data'); view.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){
    const s = Math.max(-1,Math.min(1,buf[i]));
    view.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true);
  }
  const blob = new Blob([ab], {type:'audio/wav'});
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.load();
  return audio;
}

function unlockAudio(){
  // Crée et charge le son au moment du tap (obligatoire iOS)
  try{ TIMER_AUDIO = makeBeepAudio(); }catch(e){}
}

function playTimerSound(){
  try{
    if(TIMER_AUDIO){
      TIMER_AUDIO.currentTime = 0;
      TIMER_AUDIO.play().catch(()=>{});
    }
  }catch(e){}
  // Fallback vibration
  if(navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
}

function timerDone(){
  clearInterval(TIMER.interval);
  TIMER.running = false; TIMER.seconds = 0; TIMER.endTime = null;
  localStorage.removeItem("pl_timer");
  if(navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
  playTimerSound();
  flashTimerDone();
  updateTimerDisplay();
}

function startTimer(seconds){
  // Débloque le contexte audio au moment du tap utilisateur
  unlockAudio();
  clearInterval(TIMER.interval);
  TIMER.duration = seconds;
  TIMER.seconds = seconds;
  TIMER.running = true;
  TIMER.endTime = Date.now() + seconds * 1000;
  localStorage.setItem("pl_timer", JSON.stringify({endTime:TIMER.endTime, duration:TIMER.duration}));
  showTimerWidget();
  updateTimerDisplay();
  TIMER.interval = setInterval(tickTimer, 500);
}

function tickTimer(){
  if(!TIMER.running || !TIMER.endTime) return;
  const remaining = Math.round((TIMER.endTime - Date.now()) / 1000);
  TIMER.seconds = Math.max(0, remaining);
  if(TIMER.seconds <= 0){ timerDone(); return; }
  updateTimerDisplay();
}

function pauseTimer(){
  clearInterval(TIMER.interval);
  TIMER.running = false; TIMER.endTime = null;
  localStorage.removeItem("pl_timer");
  updateTimerDisplay();
}

function resumeTimer(){
  unlockAudio();
  TIMER.running = true;
  TIMER.endTime = Date.now() + TIMER.seconds * 1000;
  localStorage.setItem("pl_timer", JSON.stringify({endTime:TIMER.endTime, duration:TIMER.duration}));
  TIMER.interval = setInterval(tickTimer, 500);
  updateTimerDisplay();
}

function stopTimer(){
  clearInterval(TIMER.interval);
  TIMER.running = false; TIMER.seconds = 0; TIMER.endTime = null;
  localStorage.removeItem("pl_timer");
  hideTimerWidget();
}

function addTimerSeconds(delta){
  TIMER.seconds = Math.max(0, TIMER.seconds + delta);
  if(TIMER.running && TIMER.endTime){
    TIMER.endTime = Date.now() + TIMER.seconds * 1000;
    localStorage.setItem("pl_timer", JSON.stringify({endTime:TIMER.endTime, duration:TIMER.duration}));
  }
  updateTimerDisplay();
}

function restoreTimer(){
  try{
    const t = localStorage.getItem("pl_timer");
    if(!t) return;
    const {endTime, duration} = JSON.parse(t);
    const remaining = Math.round((endTime - Date.now()) / 1000);
    if(remaining <= 0){
      localStorage.removeItem("pl_timer");
      playTimerSound();
      if(navigator.vibrate) navigator.vibrate([300,100,300]);
    } else {
      TIMER.duration = duration;
      TIMER.seconds = remaining;
      TIMER.endTime = endTime;
      TIMER.running = true;
      showTimerWidget();
      updateTimerDisplay();
      TIMER.interval = setInterval(tickTimer, 500);
    }
  }catch(e){}
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    clearInterval(TIMER.interval);
    restoreTimer();
  } else {
    clearInterval(TIMER.interval);
  }
});

function updateTimerDisplay(){
  const el = document.getElementById("timer-display");
  if(!el) return;
  const m = Math.floor(TIMER.seconds/60);
  const s = TIMER.seconds%60;
  el.textContent = `${m}:${s<10?"0":""}${s}`;
  const ring = document.getElementById("timer-ring");
  if(ring){
    const pct = TIMER.duration > 0 ? TIMER.seconds/TIMER.duration : 0;
    ring.style.strokeDashoffset = (2 * Math.PI * 15) * (1-pct);
  }
  const playBtn = document.getElementById("timer-playpause");
  if(playBtn) playBtn.textContent = TIMER.running ? "⏸" : "▶";
}

function flashTimerDone(){
  const widget = document.getElementById("timer-widget");
  if(!widget) return;
  let n=0;
  const flash = setInterval(()=>{
    widget.style.background = n%2===0?"#16a34a":"#0b1628";
    if(++n>5){ clearInterval(flash); widget.style.background="#0b1628"; }
  },300);
}

function showTimerWidget(){
  const w = document.getElementById("timer-widget");
  if(w) w.style.display = "flex";
}
function hideTimerWidget(){
  const w = document.getElementById("timer-widget");
  if(w) w.style.display = "none";
}
window.startTimer = startTimer;
window.pauseTimer = pauseTimer;
window.resumeTimer = resumeTimer;
window.stopTimer = stopTimer;
window.addTimerSeconds = addTimerSeconds;
window.toggleTimerPlayPause = ()=>{ TIMER.running ? pauseTimer() : resumeTimer(); };

    const active=STATE.levelFilter===l;

      border:`1px solid ${active?"#6366f1":"#1e293b"}`,

  });

  // Block cards
  const filtered=STATE.levelFilter==="Tous"?BLOCKS:BLOCKS.filter(b=>b.level===STATE.levelFilter);
  filtered.forEach(b=>{
    const isActive=STATE.activeId===b.id;
    const card=div({
      background:isActive?"#0b1628":"#020817",
      border:`1.5px solid ${isActive?b.color:"#0f172a"}`,
      borderRadius:"12px",padding:"14px",marginBottom:"10px",cursor:"pointer",
      position:"relative",boxShadow:isActive?`0 0 20px ${b.color}18`:"none",
    });
    if(isActive){
      const badge=div({position:"absolute",top:"10px",right:"10px",background:b.color,color:"#fff",fontSize:"9px",padding:"2px 8px",borderRadius:"20px",fontWeight:"700",letterSpacing:"1px"},"ACTIF");
      card.appendChild(badge);
    }
    // Header row
    const hrow=div({display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"});
    hrow.innerHTML=`<span style="font-size:24px">${b.emoji}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:800;color:${b.color};letter-spacing:1px">${b.name}</div>
        <div style="font-size:10px;color:#475569;margin-top:1px">(${b.inspo})</div>
      </div>`;
    const detailBtn=btn("Détails",{background:"#0f172a",border:"1px solid #1e293b",color:"#9ca3af",padding:"4px 10px",borderRadius:"6px",fontSize:"11px",flexShrink:"0"},e=>{e.stopPropagation();openModal(b.id);});
    hrow.appendChild(detailBtn);
    card.appendChild(hrow);
    // Desc
    card.appendChild(div({fontSize:"12px",color:"#9ca3af",lineHeight:"1.6",marginBottom:"10px"},b.desc));
    // Badges
    const badges=div({display:"flex",gap:"6px",flexWrap:"wrap"});
    const lc=LEVEL_COLOR[b.level]||"#6366f1";
    badges.innerHTML=`<span style="background:${lc}20;border:1px solid ${lc}40;color:${lc};border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">${b.level}</span>

    card.appendChild(badges);
    card.onclick=()=>{STATE.activeId=b.id;STATE.week=0;STATE.dayIdx=0;STATE.log={};save("pl_st",{id:b.id,week:0,day:0});renderTab("blocks",renderBlocks);};
    root.appendChild(card);

  const block=getBlock();
  if(!block)return;
  const card=div({background:"#0b1628",border:`1.5px solid ${block.color}25`,borderRadius:"12px",padding:"16px"});

// ── SESSION TAB ───────────────────────────────────────────────────────────────
function renderSession(root){
  const block=getBlock();

    <div style="font-size:14px;font-weight:700;color:${block.color}">${block.emoji} ${block.name}</div>

  // Sélecteur de semaine lisible

    wBtn.onclick=()=>{STATE.week=i;STATE.dayIdx=0;STATE.log={};save("pl_st",{id:STATE.activeId,week:i,day:0});renderTab("session",renderSession);};
    weekScroll.appendChild(wBtn);

  hdr.appendChild(weekScroll);

  // Info semaine active
  const activeWP=block.wp[STATE.week];
  const infoRow=div({display:"flex",gap:"6px",marginTop:"8px",flexWrap:"wrap"});
  [
    [`Semaine ${STATE.week+1}/${block.weeks}`,block.color],
    [activeWP?.lbl,"#e2e8f0"],
    [`RPE ${activeWP?.ro>0?"+":""}${activeWP?.ro!==0?activeWP?.ro:"base"}`,activeWP?.ro>0?"#ef4444":activeWP?.ro<0?"#22c55e":"#6366f1"],
    [`Vol ×${activeWP?.vm}`,activeWP?.vm>1?"#22c55e":activeWP?.vm<1?"#f59e0b":"#475569"],
  ].forEach(([text,c])=>{
    infoRow.appendChild(div({background:`${c}15`,border:`1px solid ${c}30`,borderRadius:"5px",padding:"3px 8px",fontSize:"10px",fontWeight:"600",color:c},text));
  });
  hdr.appendChild(infoRow);
  root.appendChild(hdr);

  // Day selector
  const dayRow=div({display:"flex",gap:"8px",overflowX:"auto",paddingBottom:"4px",marginBottom:"14px"});
  block.days.forEach((d,i)=>{
    const active=STATE.dayIdx===i;
    const b=btn(`<div style="font-weight:600">${d.name}</div><div style="font-size:10px;opacity:.7">${d.label}</div>`,{
      background:active?`${block.color}25`:"#0f172a",

      color:active?block.color:"#475569",
      borderRadius:"8px",padding:"8px 12px",fontSize:"12px",whiteSpace:"nowrap",flexShrink:"0",
    },()=>{STATE.dayIdx=i;STATE.log={};save("pl_st",{id:STATE.activeId,week:STATE.week,day:i});renderTab("session",renderSession);});
    dayRow.appendChild(b);

    // RPE buttons
    const rpeWrap=div({flex:"2",minWidth:"200px"});

    const rpeRow=div({display:"flex",gap:"4px",flexWrap:"wrap"});

  root.appendChild(btnRow);
}

async function saveSession2(){
  const block=getBlock();
  if(!block||STATE.saving)return;
  STATE.saving=true;
  renderTab("session",renderSession);

  const currentDayIdx=STATE.dayIdx;
  const currentWeek=STATE.week;

  const exs=getExs(block,currentWeek,currentDayIdx).map((ex,i)=>{
    const lg=STATE.log[i]||{};
    const w=parseFloat(lg.weight)||getSugg(ex)||0;
    const rpe=parseFloat(lg.rpe)||ex.targetRpe;
    return{...ex,weight:w,actualRpe:rpe,e1rm:calcE1RM(w,ex.reps,rpe)};
  });
  const ne={...STATE.e1rms};
  exs.forEach(ex=>{if(ex.weight&&ex.actualRpe)ne[ex.lift]=Math.max(ne[ex.lift]||0,ex.e1rm);});
  const nh=[...STATE.history,{
    date:new Date().toLocaleDateString("fr-FR"),
    blockId:STATE.activeId,blockName:block.name,blockInspo:block.inspo,
    week:currentWeek+1,weekLabel:block.wp[currentWeek]?.lbl,
    dayIdx:currentDayIdx,
    day:block.days[currentDayIdx]?.name,
    dayLabel:block.days[currentDayIdx]?.label,
    exercises:exs,
  }];
  STATE.e1rms=ne;
  STATE.history=nh;
  STATE.log={};
  save("pl_hist",nh);
  save("pl_e1rm",ne);
  localStorage.removeItem("pl_log");

  // ── Auto-avancement ───────────────────────────────────────────────────────
  const totalDays=block.days.length;
  if(currentDayIdx+1 < totalDays){
    STATE.dayIdx=currentDayIdx+1;
  } else {
    STATE.dayIdx=0;
    if(currentWeek+1 < block.weeks){
      STATE.week=currentWeek+1;
    }
  }
  save("pl_st",{id:STATE.activeId,week:STATE.week,day:STATE.dayIdx});

  STATE.saving=false;
  STATE.saved=true;
  renderTab("session",renderSession);
  setTimeout(()=>{STATE.saved=false;},2500);
}

// ── WEIGHT TAB ────────────────────────────────────────────────────────────────
function addBodyweight(value, dateStr){
  const w = parseFloat(value);
  if(!w || w <= 0) return;
  const date = dateStr || new Date().toISOString().split("T")[0];
  // Remove existing entry for same date, then add
  STATE.bodyweight = STATE.bodyweight.filter(e=>e.date!==date);
  STATE.bodyweight.push({date, weight:w});
  STATE.bodyweight.sort((a,b)=>a.date.localeCompare(b.date));
  save("pl_bw", STATE.bodyweight);
  renderTab("weight", renderWeight);
}

    points.forEach((p,i)=>{

      svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?5:3}" fill="${isLast?'#f97316':'#6366f1'}" stroke="#0b1628" stroke-width="1.5"/>`;

    svg += `</svg>`;

    // Legend
    graphCard.appendChild(div({display:"flex",gap:"14px",marginTop:"10px",fontSize:"10px",color:"#475569"},
      `<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;opacity:0.4;margin-right:4px"></span>Zone objectif (95-100kg)</span>

    root.appendChild(div({background:"#0b1628",border:"1px dashed #0f172a",borderRadius:"12px",padding:"30px 16px",textAlign:"center",marginBottom:"16px"},
      `<div style="font-size:28px;margin-bottom:8px">⚖️</div>
       <div style="color:#475569;font-size:12px">Ajoute au moins 2 pesées pour voir ton graphique de progression.</div>`));

  // ── History list ──
  if(entries.length > 0){

    histCard.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#6366f1",marginBottom:"10px"},"📋 HISTORIQUE DES PESÉES"));

  }

// ── HISTORY TAB ───────────────────────────────────────────────────────────────
// ── e1RM history from sessions ────────────────────────────────────────────────
function getE1rmHistory(lift){
  const points=[];
  STATE.history.forEach(s=>{
    (s.exercises||[]).forEach(ex=>{
      if(ex.lift===lift && ex.weight && ex.actualRpe && ex.e1rm){
        points.push({date:s.date, e1rm:ex.e1rm, weight:ex.weight, rpe:ex.actualRpe, reps:ex.reps, block:s.blockName});
      }
    });
  });
  // dedupe: garder le max e1RM par date
  const byDate={};
  points.forEach(p=>{ if(!byDate[p.date]||p.e1rm>byDate[p.date].e1rm) byDate[p.date]=p; });
  return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
}

function e1rmGraphSVG(points, color){
  if(points.length<2) return null;
  const W=600,H=160,PAD=28;
  const vals=points.map(p=>p.e1rm);
  const minV=Math.min(...vals)*0.95;
  const maxV=Math.max(...vals)*1.03;
  const range=maxV-minV||1;
  const xStep=(W-PAD*2)/Math.max(points.length-1,1);
  const pts=points.map((p,i)=>({
    x:PAD+i*xStep,
    y:PAD+(H-PAD*2)*(1-(p.e1rm-minV)/range),
    ...p
  }));
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaD=pathD+` L${pts[pts.length-1].x.toFixed(1)},${H-PAD} L${pts[0].x.toFixed(1)},${H-PAD} Z`;
  const gradId=`g${color.replace("#","")}`;
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaD}" fill="url(#${gradId})"/>
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    const isLast=i===pts.length-1;
    svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?5:3}" fill="${isLast?color:'#0b1628'}" stroke="${color}" stroke-width="2"/>`;
    if(isLast) svg+=`<text x="${Math.min(p.x+8,W-40)}" y="${p.y-8}" fill="${color}" font-size="11" font-weight="700">${p.e1rm}kg</text>`;
  });
  // Y axis labels
  svg+=`<text x="2" y="${PAD+4}" fill="#475569" font-size="9">${Math.round(maxV)}</text>`;
  svg+=`<text x="2" y="${H-PAD+4}" fill="#475569" font-size="9">${Math.round(minV)}</text>`;
  svg+=`</svg>`;
  return svg;
}

        recent.appendChild(div({fontSize:"9px",color:"#334155",letterSpacing:"1px",marginBottom:"6px"},"5 DERNIÈRES MESURES"));
        [...pts].reverse().slice(0,5).forEach((p,i)=>{
          const prevP=[...pts].reverse()[i+1];
          const d=prevP?(p.e1rm-prevP.e1rm):null;
          const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderTop:"1px solid #0f172a",fontSize:"11px"});
          row.innerHTML=`<span style="color:#475569">${p.date}</span>
            <span style="color:#e2e8f0;font-weight:600">${p.weight}kg × ${p.reps} reps</span>
            <span style="color:${color};font-weight:700">${p.e1rm}kg</span>
            ${d!==null?`<span style="font-size:10px;color:${d>=0?"#22c55e":"#ef4444"}">${d>=0?"+":""}${d}</span>`:"<span></span>"}`;
          recent.appendChild(row);
        });
        card.appendChild(recent);
      }

      // Manual e1RM override
      const manualRow=div({display:"flex",gap:"6px",alignItems:"center",marginTop:"10px",padding:"8px",background:"#020817",borderRadius:"8px"});
      manualRow.appendChild(div({fontSize:"9px",color:"#475569",flexShrink:"0"},"Max manuel :"));
      const mInput=document.createElement("input");
      mInput.type="number";mInput.step="0.5";
      mInput.value=STATE.e1rms[name]||"";mInput.placeholder="kg";
      Object.assign(mInput.style,{flex:"1",background:"#0b1628",border:"1px solid #1e293b",borderRadius:"6px",color:"#e2e8f0",padding:"6px 8px",fontSize:"13px",fontWeight:"600",fontFamily:"inherit",outline:"none"});
      manualRow.appendChild(mInput);
      manualRow.appendChild(btn("✓",{background:color,color:"#fff",padding:"6px 12px",borderRadius:"6px",fontSize:"12px",fontWeight:"700"},()=>{
        const v=parseFloat(mInput.value);
        if(v>0){STATE.e1rms[name]=Math.max(STATE.e1rms[name]||0,v);save("pl_e1rm",STATE.e1rms);}
      }));
      card.appendChild(manualRow);

      root.appendChild(card);
    });

    // ── PRÉDICTION DE PROGRESSION ─────────────────────────────────────────
    const predCard=div({background:"#0b1628",border:"1.5px solid #a855f730",borderRadius:"12px",padding:"16px",marginBottom:"14px"});
    predCard.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#a855f7",marginBottom:"4px"},"🔮 PRÉDICTION DE PROGRESSION"));
    predCard.appendChild(div({fontSize:"10px",color:"#475569",marginBottom:"14px"},"Basée sur ta vitesse de progression actuelle · Estimation sur 3, 6 et 12 mois"));

    const LIFTS_P=["Squat","Bench Press","Deadlift"];
    const LIFT_COLOR_P={"Squat":"#6366f1","Bench Press":"#06b6d4","Deadlift":"#f97316"};
    const LIFT_EMOJI_P={"Squat":"🦵","Bench Press":"💪","Deadlift":"⛓️"};

    let hasPredData=false;

    LIFTS_P.forEach(lift=>{
      const pts=getE1rmHistory(lift);
      if(pts.length<2) return;
      hasPredData=true;

      // Régression linéaire simple sur les points e1RM
      const n=pts.length;
      // Convertit les dates en jours depuis le premier point
      const t0=new Date(pts[0].date).getTime();
      const xs=pts.map(p=>(new Date(p.date).getTime()-t0)/(1000*60*60*24));
      const ys=pts.map(p=>p.e1rm);
      const sumX=xs.reduce((a,b)=>a+b,0);
      const sumY=ys.reduce((a,b)=>a+b,0);
      const sumXY=xs.reduce((a,x,i)=>a+x*ys[i],0);
      const sumX2=xs.reduce((a,x)=>a+x*x,0);
      const denom=n*sumX2-sumX*sumX;
      const slope=denom!==0?(n*sumXY-sumX*sumY)/denom:0; // kg/jour
      const intercept=(sumY-slope*sumX)/n;
      const current=ys[ys.length-1];

      // Prédictions
      const pred3m=Math.round((intercept+slope*90)*10)/10;
      const pred6m=Math.round((intercept+slope*180)*10)/10;
      const pred12m=Math.round((intercept+slope*365)*10)/10;
      const gain3m=Math.round((pred3m-current)*10)/10;
      const gain6m=Math.round((pred6m-current)*10)/10;
      const gain12m=Math.round((pred12m-current)*10)/10;

      // Vitesse de progression
      const kgPerWeek=Math.round(slope*7*10)/10;
      const color=LIFT_COLOR_P[lift];

      const row=div({background:"#020817",borderRadius:"10px",padding:"12px",marginBottom:"8px"});

      // Header lift
      row.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:7px">
          <span style="font-size:16px">${LIFT_EMOJI_P[lift]}</span>
          <div>
            <div style="font-size:12px;font-weight:700;color:${color}">${lift==="Bench Press"?"Bench Press":lift}</div>
            <div style="font-size:9px;color:#475569">Progression : <span style="color:${kgPerWeek>=0?"#22c55e":"#ef4444"};font-weight:700">${kgPerWeek>=0?"+":""}${kgPerWeek} kg/semaine</span></div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;color:${color}">${current}kg</div>
          <div style="font-size:9px;color:#475569">e1RM actuel</div>
        </div>
      </div>`;

      // Barres de prédiction
      const maxPred=Math.max(pred3m,pred6m,pred12m,current);
      const minPred=Math.min(current)*0.95;
      const predRange=maxPred-minPred||1;

      [[pred3m,gain3m,"3 mois"],[pred6m,gain6m,"6 mois"],[pred12m,gain12m,"12 mois"]].forEach(([pred,gain,label])=>{
        const pct=Math.max(0,Math.min(100,((pred-minPred)/predRange)*100));
        const gc=gain>=0?"#22c55e":"#ef4444";
        const predRow=div({marginBottom:"6px"});
        predRow.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <span style="font-size:10px;color:#475569">${label}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11px;font-weight:700;color:#e2e8f0">${pred>0?pred:"—"}kg</span>
            <span style="font-size:10px;font-weight:700;color:${gc}">${gain>=0?"+":""}${gain}kg</span>
          </div>
        </div>
        <div style="background:#0f172a;border-radius:4px;height:6px;overflow:hidden">
          <div style="background:linear-gradient(90deg,${color}80,${color});height:100%;width:${pct}%;border-radius:4px;transition:width .5s"></div>
        </div>`;
        row.appendChild(predRow);
      });

      // Avertissement si pas assez de données
      if(pts.length<5){
        const warn=div({marginTop:"8px",padding:"7px 10px",background:"rgba(234,179,8,.08)",borderLeft:"3px solid #eab308",borderRadius:"5px"});
        warn.innerHTML=`<div style="font-size:10px;color:#eab308">⚠️ Prédiction peu fiable — ${pts.length} mesure${pts.length>1?"s":""} seulement. Plus tu enregistres de séances, plus la prédiction sera précise.</div>`;
        row.appendChild(warn);
      }

      predCard.appendChild(row);
    });

    if(!hasPredData){
      predCard.appendChild(div({fontSize:"11px",color:"#475569",textAlign:"center",padding:"16px"},
        "Pas encore assez de données.\nEnregistre au moins 2 séances par mouvement pour voir les prédictions."));
    } else {
      // Note méthodologique
      predCard.appendChild(div({fontSize:"9px",color:"#1e293b",marginTop:"8px",padding:"8px",background:"#020817",borderRadius:"6px",lineHeight:"1.5"},
        "💡 Prédiction basée sur une régression linéaire de ton historique e1RM. Les gains réels peuvent varier selon la récupération, la nutrition et l'intensité des blocs."));
    }

    root.appendChild(predCard);

    return;
  }

  // ── TAB : BLOCS ──
  if(HIST_TAB==="blocs"){
    root.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#6366f1",marginBottom:"4px"},"📊 COMPARATEUR DE BLOCS"));
    root.appendChild(div({fontSize:"10px",color:"#475569",marginBottom:"14px"},"Compare tes e1RM au début et à la fin de chaque bloc complété."));

    // Récupère tous les blocs uniques dans l'historique
    const blocIds=[...new Set(STATE.history.map(s=>s.blockId))].filter(Boolean);

    if(!blocIds.length){
      root.appendChild(div({background:"#0b1628",border:"1px dashed #0f172a",borderRadius:"12px",padding:"40px 16px",textAlign:"center"},
        `<div style="font-size:28px;margin-bottom:10px">📊</div>
         <div style="color:#475569;font-size:12px">Aucun bloc enregistré.<br>Commence à t'entraîner pour voir la comparaison.</div>`));
      return;
    }

    const LIFTS_C=["Squat","Bench Press","Deadlift"];

    blocIds.forEach(blockId=>{
      const blockSessions=STATE.history.filter(s=>s.blockId===blockId);
      if(!blockSessions.length) return;

      const bt=BLOCKS.find(b=>b.id===blockId);
      const color=bt?.color||"#6366f1";
      const emoji=bt?.emoji||"📦";
      const name=bt?.name||blockId;

      // Semaines présentes
      const weeks=[...new Set(blockSessions.map(s=>s.week))].sort((a,b)=>a-b);
      const firstWeek=weeks[0], lastWeek=weeks[weeks.length-1];

      // e1RM par mouvement : première semaine vs dernière semaine
      const firstSessions=blockSessions.filter(s=>s.week===firstWeek);
      const lastSessions=blockSessions.filter(s=>s.week===lastWeek);

      function bestE1rmInSessions(sessions, lift){
        let best=0;
        sessions.forEach(s=>(s.exercises||[]).forEach(ex=>{
          if(ex.lift===lift && ex.e1rm && ex.e1rm>best) best=ex.e1rm;
        }));
        return best||null;
      }

      const card=div({background:"#0b1628",border:`1.5px solid ${color}30`,borderRadius:"12px",padding:"16px",marginBottom:"14px"});

      // Header
      card.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <span style="font-size:20px">${emoji}</span>
        <div>
          <div style="font-size:14px;font-weight:700;color:${color}">${name}</div>
          <div style="font-size:10px;color:#475569">S${firstWeek} → S${lastWeek} · ${blockSessions.length} séance${blockSessions.length>1?"s":""}</div>
        </div>
      </div>`;

      // Tableau comparatif
      const table=div({background:"#020817",borderRadius:"8px",overflow:"hidden",marginBottom:"10px"});

      // Header table
      table.innerHTML=`<div style="display:grid;grid-template-columns:1fr 80px 80px 70px;gap:0;padding:7px 10px;background:#0f172a">
        <div style="font-size:9px;color:#475569;letter-spacing:1px">MOUVEMENT</div>
        <div style="font-size:9px;color:#475569;text-align:center">DÉBUT</div>
        <div style="font-size:9px;color:#475569;text-align:center">FIN</div>
        <div style="font-size:9px;color:#475569;text-align:center">GAIN</div>
      </div>`;

      let hasData=false;
      LIFTS_C.forEach((lift,i)=>{
        const start=bestE1rmInSessions(firstSessions,lift);
        const end=bestE1rmInSessions(lastSessions,lift);
        if(!start && !end) return;
        hasData=true;
        const gain=(start&&end)?(end-start):null;
        const gainColor=gain===null?"#475569":gain>0?"#22c55e":gain<0?"#ef4444":"#475569";

        const row=div({display:"grid",gridTemplateColumns:"1fr 80px 80px 70px",gap:0,padding:"9px 10px",borderTop:"1px solid #0f172a"});
        row.innerHTML=`<div style="font-size:12px;color:#d1d5db;font-weight:600">${lift==="Bench Press"?"Bench":lift}</div>
          <div style="font-size:12px;color:#475569;text-align:center">${start?start+"kg":"—"}</div>
          <div style="font-size:12px;color:${color};font-weight:700;text-align:center">${end?end+"kg":"—"}</div>
          <div style="font-size:12px;font-weight:800;color:${gainColor};text-align:center">${gain!==null?(gain>=0?"+":"")+gain+"kg":"—"}</div>`;
        table.appendChild(row);
      });

      if(!hasData){
        table.innerHTML+=`<div style="padding:12px;font-size:11px;color:#334155;text-align:center">Pas assez de données pour comparer.</div>`;
      }
      card.appendChild(table);

      // Total gain
      const totalGains=LIFTS_C.map(lift=>{
        const s=bestE1rmInSessions(firstSessions,lift);
        const e=bestE1rmInSessions(lastSessions,lift);
        return(s&&e)?(e-s):0;
      });
      const totalGain=totalGains.reduce((a,b)=>a+b,0);

      if(hasData&&totalGain!==0){
        card.appendChild(div({
          display:"flex",justifyContent:"space-between",alignItems:"center",
          padding:"10px 12px",background:`${color}12`,borderRadius:"8px",
        },`<span style="font-size:11px;color:#475569;font-weight:600">Gain total sur le bloc</span>
           <span style="font-size:16px;font-weight:800;color:${totalGain>0?"#22c55e":"#ef4444"}">${totalGain>0?"+":""}${totalGain} kg</span>`));
      }

      root.appendChild(card);
    });

    // Comparaison globale entre blocs si plusieurs blocs
    if(blocIds.length>=2){
      const summaryCard=div({background:"#0b1628",border:"1px solid #6366f130",borderRadius:"12px",padding:"16px",marginBottom:"14px"});
      summaryCard.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#6366f1",marginBottom:"12px"}),"🔄 PROGRESSION GLOBALE");

      LIFTS_C.forEach(lift=>{
        const allE1rms=[];
        STATE.history.forEach(s=>(s.exercises||[]).forEach(ex=>{
          if(ex.lift===lift&&ex.e1rm) allE1rms.push({week:s.week,blockId:s.blockId,date:s.date,e1rm:ex.e1rm});
        }));
        if(allE1rms.length<2) return;
        allE1rms.sort((a,b)=>a.date.localeCompare(b.date));
        const first=allE1rms[0], last=allE1rms[allE1rms.length-1];
        const gain=last.e1rm-first.e1rm;

        const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #0f172a"});
        row.innerHTML=`<span style="font-size:12px;color:#d1d5db;font-weight:600">${lift==="Bench Press"?"Bench":lift}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:11px;color:#475569">${first.e1rm}kg</span>
            <span style="color:#1e293b">→</span>
            <span style="font-size:13px;font-weight:700;color:#6366f1">${last.e1rm}kg</span>
            <span style="font-size:12px;font-weight:800;color:${gain>=0?"#22c55e":"#ef4444"}">${gain>=0?"+":""}${gain}kg</span>
          </div>`;
        summaryCard.appendChild(row);
      });
      root.appendChild(summaryCard);
    }

    return;
  }

  // ── TAB : SÉANCES ──
  const lifts=["Squat","Bench Press","Deadlift"].filter(l=>STATE.e1rms[l]);
  if(lifts.length){
    const grid=div({display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px",marginBottom:"16px"});
    lifts.forEach(l=>{
      grid.appendChild(div({background:"#0b1628",border:"1px solid #0f172a",borderRadius:"10px",padding:"12px",textAlign:"center"},
        `<div style="font-size:10px;color:#475569;letter-spacing:1px">${l==="Bench Press"?"BENCH":l.toUpperCase()}</div>
         <div style="font-size:22px;font-weight:800;color:#6366f1;margin-top:2px">${STATE.e1rms[l]}<span style="font-size:13px">kg</span></div>
         <div style="font-size:9px;color:#334155">e1RM max</div>`));
    });
    root.appendChild(grid);
  }

  if(!STATE.history.length){
    root.appendChild(div({background:"#0b1628",border:"1px solid #0f172a",borderRadius:"12px",padding:"40px 16px",textAlign:"center"},
      `<div style="font-size:32px;margin-bottom:10px">📋</div><div style="color:#475569;font-size:13px">Aucune séance enregistrée.</div>`));
    return;
  }

  [...STATE.history].map((s,realIdx)=>({s,realIdx})).reverse().forEach(({s,realIdx})=>{
    const bt=BLOCKS.find(b=>b.id===s.blockId);
    const card=div({background:"#0b1628",border:"1px solid #0f172a",borderRadius:"12px",padding:"14px",marginBottom:"8px"});
    const hdr=div({display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px",gap:"8px"});
    const hdrLeft=div({display:"flex",alignItems:"center",gap:"8px",flex:"1",minWidth:"0"});
    hdrLeft.innerHTML=`
      <span style="font-size:16px;flex-shrink:0">${bt?.emoji||"📋"}</span>
      <div style="min-width:0">
        <div style="font-size:13px;font-weight:700;color:${bt?.color||"#6366f1"}">${s.blockName}</div>
        <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
          <span style="background:${bt?.color||"#6366f1"}18;border:1px solid ${bt?.color||"#6366f1"}30;color:${bt?.color||"#6366f1"};border-radius:4px;padding:1px 7px;font-size:9px;font-weight:700">Sem. ${s.week||"?"}${s.weekLabel?" — "+s.weekLabel:""}</span>
          <span style="background:#0f172a80;border:1px solid #1e293b;color:#d1d5db;border-radius:4px;padding:1px 7px;font-size:9px;font-weight:600">${s.day||"Jour ?"}${s.dayLabel?" — "+s.dayLabel:""}</span>
          <span style="color:#334155;font-size:9px;align-self:center">${s.date}</span>
        </div>
      </div>`;
    const confirmZone=div({display:"none",alignItems:"center",gap:"6px",marginTop:"8px",padding:"8px",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:"8px"});
    confirmZone.innerHTML=`<span style="font-size:11px;color:#ef4444;flex:1">Supprimer cette séance ?</span>`;
    const btnOui=document.createElement("button");
    btnOui.textContent="Oui";
    Object.assign(btnOui.style,{background:"#ef4444",border:"none",color:"#fff",padding:"5px 12px",borderRadius:"6px",fontSize:"12px",fontWeight:"700"});
    btnOui.onclick=()=>{STATE.history.splice(realIdx,1);save("pl_hist",STATE.history);renderTab("history",renderHistory);};
    const btnNon=document.createElement("button");
    btnNon.textContent="Non";
    Object.assign(btnNon.style,{background:"#1e293b",border:"none",color:"#e2e8f0",padding:"5px 12px",borderRadius:"6px",fontSize:"12px"});
    btnNon.onclick=()=>{confirmZone.style.display="none";delOne.style.opacity="1";};
    confirmZone.appendChild(btnOui);confirmZone.appendChild(btnNon);
    const delOne=document.createElement("button");
    delOne.textContent="🗑️";
    Object.assign(delOne.style,{background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",color:"#ef4444",padding:"5px 9px",borderRadius:"7px",fontSize:"14px",flexShrink:"0"});
    delOne.onclick=()=>{confirmZone.style.display="flex";delOne.style.opacity="0.4";};
    hdr.appendChild(hdrLeft);hdr.appendChild(delOne);
    card.appendChild(hdr);card.appendChild(confirmZone);
    (s.exercises||[]).forEach((ex,j)=>{
      const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderTop:"1px solid #0f172a",fontSize:"12px",gap:"6px"});
      row.innerHTML=`<span style="color:#d1d5db;flex:1">${ex.lift}</span>
        <span style="color:#e2e8f0;font-weight:600">${ex.weight}kg×${ex.reps}</span>
        <span style="background:${rpeC(ex.actualRpe)}18;color:${rpeC(ex.actualRpe)};padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600">RPE ${ex.actualRpe}</span>
        <span style="color:#6366f1;font-size:11px">e1RM ${ex.e1rm}kg</span>`;
      card.appendChild(row);
    });
    root.appendChild(card);
  });

  const delBtn=btn("🗑️ Effacer tout l'historique",{marginTop:"8px",background:"#0f172a",border:"1px solid #991b1b",color:"#ef4444",padding:"8px 16px",borderRadius:"8px",fontSize:"12px"},()=>{
    if(confirm("Effacer tout l'historique ?")){STATE.history=[];STATE.e1rms={};save("pl_hist",[]);save("pl_e1rm",{});renderTab("history",renderHistory);}
  });
  root.appendChild(delBtn);
}

// ── SETTINGS TAB ─────────────────────────────────────────────────────────────
function renderSettings(root){
  root.appendChild(div({fontSize:"18px",fontWeight:"800",letterSpacing:"2px",marginBottom:"16px"},"CONFIGURATION"));

  // Storage info
  root.appendChild(div({background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"12px 14px",marginBottom:"12px"},
    `<div style="display:flex;align-items:center;gap:10px">
       <div style="width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 8px #22c55e"></div>
       <div>
         <div style="font-size:13px;font-weight:700;color:#22c55e">Stockage local actif</div>
         <div style="font-size:11px;color:#166534;margin-top:2px">Données sauvegardées sur cet appareil. Reste dans Safari si tu ajoutes le fichier à l'écran d'accueil.</div>
       </div>
     </div>`));

  // ── EXPORT / IMPORT ────────────────────────────────────────────────────────
  const eiCard=div({background:"#0b1628",border:"1px solid #6366f140",borderRadius:"12px",padding:"16px",marginBottom:"12px"});
  eiCard.appendChild(div({fontSize:"13px",fontWeight:"700",color:"#6366f1",marginBottom:"4px"},"💾 SAUVEGARDE & RESTAURATION"));
  eiCard.appendChild(div({fontSize:"11px",color:"#475569",marginBottom:"14px"},
    "Exporte tes données avant chaque mise à jour de l'app. Réimporte-les ensuite pour ne rien perdre."));

  // Export button
  const exportBtn=btn("📤 EXPORTER MES DONNÉES (JSON)",{
    width:"100%",background:"#6366f1",border:"none",color:"#fff",
    padding:"12px",borderRadius:"8px",fontSize:"12px",fontWeight:"700",
    letterSpacing:"1px",marginBottom:"8px",
  },()=>{
    const block=getBlock();
    const data={
      version:2,
      exportDate:new Date().toISOString(),
      exportInfo:{
        blockId:STATE.activeId,
        blockName:block?.name||null,
        week:STATE.week,
        weekLabel:block?.wp[STATE.week]?.lbl||null,
        dayIdx:STATE.dayIdx,
        dayName:block?.days[STATE.dayIdx]?.name||null,
      },
      history:STATE.history,
      e1rms:STATE.e1rms,
      bodyweight:STATE.bodyweight,
    };
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`powerlog_backup_${new Date().toISOString().split("T")[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  eiCard.appendChild(exportBtn);

  // Import button
  const importWrap=div({position:"relative"});
  const importBtn=btn("📥 IMPORTER UNE SAUVEGARDE",{
    width:"100%",background:"#0f172a",border:"1px solid #6366f1",color:"#6366f1",
    padding:"12px",borderRadius:"8px",fontSize:"12px",fontWeight:"700",
    letterSpacing:"1px",marginBottom:"8px",
  },()=>{ fileInput.click(); });
  const fileInput=document.createElement("input");
  fileInput.type="file";fileInput.accept=".json";
  fileInput.style.display="none";
  fileInput.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.version||!data.history){
          alert("Fichier invalide — ce n'est pas une sauvegarde PowerLog.");
          return;
        }
        // Confirmation inline
        const confirmDiv=document.getElementById("import-confirm");
        confirmDiv.style.display="block";
        confirmDiv._data=data;
      }catch(err){
        alert("Erreur de lecture du fichier.");
      }
    };
    reader.readAsText(file);
  };
  importWrap.appendChild(importBtn);
  importWrap.appendChild(fileInput);

  // Confirm zone
  const confirmImport=div({display:"none",padding:"12px",background:"rgba(79,70,229,.1)",border:"1px solid #6366f1",borderRadius:"8px",marginBottom:"8px"});
  confirmImport.id="import-confirm";
  confirmImport.innerHTML=`<div style="font-size:12px;color:#6366f1;margin-bottom:10px;font-weight:600">⚠️ Importer écrasera tes données actuelles. Continuer ?</div>`;
  const confirmRow=div({display:"flex",gap:"8px"});
  const yesBtnI=btn("✅ Oui, importer",{background:"#6366f1",color:"#fff",padding:"8px 16px",borderRadius:"7px",fontSize:"12px",fontWeight:"700"},()=>{
    const data=confirmImport._data;
    if(!data)return;
    STATE.history=data.history||[];
    STATE.e1rms=data.e1rms||{};
    STATE.bodyweight=data.bodyweight||[];
    save("pl_hist",STATE.history);
    save("pl_e1rm",STATE.e1rms);
    save("pl_bw",STATE.bodyweight);
    // Restaure la position dans le programme si disponible
    if(data.exportInfo){
      const info=data.exportInfo;
      STATE.activeId=info.blockId||null;
      STATE.week=info.week||0;
      STATE.dayIdx=info.dayIdx||0;
      save("pl_st",{id:STATE.activeId,week:STATE.week,day:STATE.dayIdx});
    }
    confirmImport.style.display="none";
    const info=data.exportInfo;
    const msg=`✅ Import réussi !\n${STATE.history.length} séances restaurées.`
      +(info?.blockName?`\n\nPosition restaurée :\n📦 ${info.blockName}\n📅 Semaine ${(info.week||0)+1}${info.weekLabel?" — "+info.weekLabel:""}\n🏋️ ${info.dayName||"Jour 1"}`:"");
    alert(msg);
    renderTab("settings",renderSettings);
  });
  const noBtnI=btn("Annuler",{background:"#1e293b",color:"#e2e8f0",padding:"8px 16px",borderRadius:"7px",fontSize:"12px"},()=>{
    confirmImport.style.display="none";
  });
  confirmRow.appendChild(yesBtnI);
  confirmRow.appendChild(noBtnI);
  confirmImport.appendChild(confirmRow);

  importWrap.appendChild(confirmImport);
  eiCard.appendChild(importWrap);

  // Stats résumé
  const statsDiv=div({background:"#020817",borderRadius:"8px",padding:"10px",fontSize:"11px",color:"#475569"});
  statsDiv.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:4px">
    <span>Séances enregistrées</span><span style="color:#e2e8f0;font-weight:600">${STATE.history.length}</span>
  </div>
  <div style="display:flex;justify-content:space-between;margin-bottom:4px">
    <span>Pesées enregistrées</span><span style="color:#e2e8f0;font-weight:600">${STATE.bodyweight.length}</span>
  </div>
  <div style="display:flex;justify-content:space-between">
    <span>Dernière séance</span><span style="color:#e2e8f0;font-weight:600">${STATE.history.length?STATE.history[STATE.history.length-1].date:"—"}</span>
  </div>`;
  eiCard.appendChild(statsDiv);
  root.appendChild(eiCard);

  // e1RM
  const eCard=div({background:"#0b1628",border:"1px solid #0f172a",borderRadius:"12px",padding:"16px",marginBottom:"12px"});
  eCard.appendChild(div({fontSize:"13px",fontWeight:"700",color:"#6366f1",marginBottom:"4px"},"🏆 Maximas (e1RM)"));
  eCard.appendChild(div({fontSize:"11px",color:"#475569",marginBottom:"12px"},"Entre tes maximas pour calibrer les suggestions dès le départ."));
  ["Squat","Bench Press","Deadlift"].forEach(l=>{
    const row=div({display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"});
    row.appendChild(div({color:"#d1d5db",fontSize:"13px",flex:"1"},l));
    const inp=document.createElement("input");
    inp.type="number";inp.step="2.5";inp.value=STATE.e1rms[l]||"";inp.placeholder="kg";
    Object.assign(inp.style,{width:"80px",background:"#020817",border:"1px solid #1e293b",borderRadius:"8px",color:"#e2e8f0",padding:"8px 10px",fontSize:"15px",fontWeight:"600"});
    inp.oninput=e=>{STATE.e1rms[l]=parseFloat(e.target.value)||0;save("pl_e1rm",STATE.e1rms);};
    row.appendChild(inp);
    row.appendChild(div({color:"#334155",fontSize:"12px"},"kg"));
    eCard.appendChild(row);
  });
  root.appendChild(eCard);

  // RPE guide
  const rCard=div({background:"#0b1628",border:"1px solid #0f172a",borderRadius:"12px",padding:"16px",marginBottom:"12px"});
  rCard.appendChild(div({fontSize:"13px",fontWeight:"700",color:"#6366f1",marginBottom:"12px"},"📖 Guide RPE (Tuchscherer)"));
  [[6,"4+ reps — Échauffement"],[6.5,"3-4 reps — Très facile"],[7,"3 reps — Modéré"],[7.5,"2-3 reps — Confortable"],[8,"2 reps — Difficile"],[8.5,"1-2 reps — Très difficile"],[9,"1 rep — Presque max"],[9.5,"0-1 rep — Proche du max"],[10,"0 rep — Maximum absolu"]].forEach(([r,d])=>{
    const row=div({display:"flex",alignItems:"center",gap:"10px",padding:"5px 0",borderBottom:"1px solid #0f172a"});
    row.innerHTML=`<span style="background:${rpeC(r)}18;color:${rpeC(r)};padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;min-width:36px;text-align:center">${r}</span>
      <span style="font-size:12px;color:#475569">${d}</span>`;
    rCard.appendChild(row);
  });
  rCard.appendChild(div({marginTop:"12px",padding:"12px",background:"#020817",borderRadius:"8px",fontSize:"11px",color:"#475569",lineHeight:"1.7"},
    "💡 <strong style='color:#9ca3af'>Autorégulation :</strong> L'app calcule ton e1RM estimé à chaque séance. Si ton RPE réel dépasse la cible, le poids suggéré est réduit automatiquement — et inversement."));
  root.appendChild(rCard);

  // Block list
  const bCard=div({background:"#0b1628",border:"1px solid #0f172a",borderRadius:"12px",padding:"16px"});
  bCard.appendChild(div({fontSize:"13px",fontWeight:"700",color:"#6366f1",marginBottom:"12px"},"🏆 Les 10 programmes"));
  BLOCKS.forEach(b=>{
    const lc=LEVEL_COLOR[b.level]||"#6366f1";
    const row=div({display:"flex",alignItems:"center",gap:"10px",padding:"8px 0",borderBottom:"1px solid #0f172a"});
    row.innerHTML=`<span style="font-size:16px">${b.emoji}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;color:${b.color}">${b.name}</div>
        <div style="font-size:10px;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">(${b.inspo})</div>
      </div>
      <span style="background:${lc}20;border:1px solid ${lc}40;color:${lc};border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;flex-shrink:0">${b.level}</span>`;
    bCard.appendChild(row);
  });
  root.appendChild(bCard);
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openModal(id){
  const b=BLOCKS.find(x=>x.id===id);
  if(!b)return;
  const overlay=document.getElementById("modal-overlay");
  const box=document.getElementById("modal-box");
  const content=document.getElementById("modal-content");
  box.style.borderColor=b.color;
  const lc=LEVEL_COLOR[b.level]||"#6366f1";
  let html=`<div style="width:36px;height:4px;background:#1e293b;border-radius:2px;margin:0 auto 16px"></div>
    <div style="background:${b.color}15;border:1px solid ${b.color}30;border-radius:8px;padding:6px 12px;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px">
      <span style="font-size:11px;color:${b.color}">Inspiré de :</span>
      <span style="font-size:12px;color:#e2e8f0;font-weight:700">${b.inspo}</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <span style="font-size:28px">${b.emoji}</span>
      <div>
        <div style="font-size:18px;font-weight:800;color:${b.color};letter-spacing:1px">${b.name}</div>
        <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
          <span style="background:${lc}20;border:1px solid ${lc}40;color:${lc};border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">${b.level}</span>
          <span style="background:${b.color}20;border:1px solid ${b.color}40;color:${b.color};border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">${b.weeks} semaines</span>
          <span style="background:#47556920;border:1px solid #47556940;color:#475569;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">3j / sem</span>
        </div>
      </div>
    </div>
    <div style="font-size:13px;color:#9ca3af;line-height:1.7;margin-bottom:${b.notes?'10px':'16px'};padding:12px;background:#020817;border-radius:8px;border-left:3px solid ${b.color}60">${b.desc}</div>
    ${b.notes?`<div style="font-size:11px;line-height:1.8;margin-bottom:16px;padding:12px;background:#052e16;border-radius:8px;border-left:3px solid #22c55e;color:#86efac">${b.notes.replace(/\n/g,'<br>')}</div>`:''}
    <div style="font-size:11px;color:#475569;letter-spacing:2px;margin-bottom:8px">STRUCTURE</div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px">`;
  b.wp.forEach((w,i)=>{
    const bg=w.ro>0?"#450a0a":w.ro<0?"#052e16":"#0d1424";
    const bc=w.ro>0?"#991b1b":w.ro<0?"#166534":"#3730a3";
    const tc=w.ro>0?"#ef4444":w.ro<0?"#22c55e":"#6366f1";
    html+=`<div style="background:${bg};border:1px solid ${bc};border-radius:8px;padding:8px 10px;text-align:center;flex-shrink:0;min-width:64px">
      <div style="font-size:9px;color:#475569">S${i+1}</div>
      <div style="font-size:11px;color:#e2e8f0;margin-top:1px">${w.lbl}</div>
      <div style="font-size:9px;color:${tc};margin-top:2px">${w.ro>0?"+":""}${w.ro!==0?"RPE"+w.ro:"Base"} ×${w.vm}</div>
    </div>`;
  });
  html+=`</div><div style="font-size:11px;color:#475569;letter-spacing:2px;margin-bottom:8px">JOURS</div>`;
  b.days.forEach(d=>{
    html+=`<div style="background:#020817;border:1px solid #0f172a;border-radius:8px;padding:12px;margin-bottom:6px">
      <div style="font-size:12px;font-weight:600;color:${b.color};margin-bottom:8px">${d.name} — ${d.label}</div>`;
    d.exs.forEach((ex,ei)=>{
      html+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;${ei>0?"border-top:1px solid #0f172a":""}">
        <span style="color:#d1d5db">${ex.l}</span>
        <span style="color:${rpeC(ex.rpe)};font-weight:600">${ex.s}×${ex.r} @ RPE ${ex.rpe}</span>
      </div>`;
    });
    html+=`</div>`;
  });
  content.innerHTML=html;
  // Use button
  const useBtn=btn("▶ UTILISER CE BLOC",{marginTop:"12px",width:"100%",background:b.color,border:"none",color:"#fff",padding:"14px",borderRadius:"10px",fontSize:"13px",fontWeight:"700",letterSpacing:"1px"},()=>{
    STATE.activeId=b.id;STATE.week=0;STATE.dayIdx=0;STATE.log={};
    save("pl_st",{id:b.id,week:0,day:0});
    closeModal();goTab("session");
  });
  content.appendChild(useBtn);
  overlay.style.display="flex";
}
function closeModal(){document.getElementById("modal-overlay").style.display="none";}
window.closeModal=closeModal;

// ── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded",()=>{
  load();
  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    const main=document.getElementById("main");
    main.style.display="flex";
    render();
    restoreTimer();
  },600);
});
</script>
</body>
</html>
