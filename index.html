<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PowerLog"/>
  <meta name="theme-color" content="#030712"/>
  <title>PowerLog</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;
      overflow:hidden;
      background:#030712;
      font-family:system-ui,-apple-system,sans-serif;
      color:#e2e8f0;
      overscroll-behavior:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    #app{
      position:fixed;
      top:0;right:0;bottom:0;left:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    #safe-top{
      flex-shrink:0;
      height:env(safe-area-inset-top);
      min-height:env(safe-area-inset-top);
      background:rgba(3,7,18,.97);
    }
    #safe-bottom{
      display:none;
    }
    /* scrollbar */
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:#4f46e5;border-radius:2px}
    /* inputs */
    input[type=number]{-moz-appearance:textfield;outline:none}
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    /* animations */
    @keyframes pulse{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .page{animation:fadein .2s ease}
    /* safe area header et nav */
    #header{
      padding-top:12px;
      padding-left:16px;
      padding-right:16px;
      padding-bottom:10px;
    }
    #bottomnav{padding-bottom:8px}
    /* buttons */
    button{cursor:pointer;font-family:inherit;-webkit-appearance:none;border:none}
    /* cards */
    .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px}
    /* badge */
    .badge{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
    /* pill */
    .pill{border-radius:8px;padding:6px 12px;font-size:12px;white-space:nowrap;cursor:pointer}
    /* active tab */
    .nav-btn{flex:1;background:transparent;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
    /* scroll container */
    #content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
    #inner{max-width:600px;margin:0 auto;padding:14px 14px 20px 14px}
  </style>
</head>
<body>
<div id="app">

  <!-- SAFE AREA TOP -->
  <div id="safe-top"></div>

  <!-- LOADING -->
  <div id="loading" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <div style="font-size:28px;font-weight:900;letter-spacing:4px">
      <span style="color:#818cf8">POWER</span><span style="color:#e2e8f0">LOG</span>
    </div>
    <div style="display:flex;gap:6px">
      <div style="width:8px;height:8px;border-radius:50%;background:#4f46e5;animation:pulse 1s 0s infinite ease-in-out"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#4f46e5;animation:pulse 1s .2s infinite ease-in-out"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#4f46e5;animation:pulse 1s .4s infinite ease-in-out"></div>
    </div>
    <div style="font-size:10px;color:#374151;letter-spacing:2px">CHARGEMENT...</div>
  </div>

  <!-- MAIN (hidden until ready) -->
  <div id="main" style="display:none;flex-direction:column;flex:1;overflow:hidden">

    <!-- HEADER -->
    <div id="header" style="flex-shrink:0;background:rgba(3,7,18,.97);border-bottom:1px solid #1f2937;padding:10px 16px;display:flex;align-items:center;justify-content:space-between">
      <div onclick="goTab('blocks')" style="cursor:pointer">
        <div style="font-size:22px;font-weight:900;letter-spacing:3px;line-height:1">
          <span style="color:#818cf8">POWER</span><span style="color:#e2e8f0">LOG</span>
        </div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
          <div style="width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e"></div>
          <span style="font-size:9px;color:#374151;letter-spacing:2px">LOCAL STORAGE</span>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="content">
      <div id="inner">
        <div id="tab-profile" class="page" style="display:none"></div>
        <div id="tab-blocks" class="page"></div>
        <div id="tab-session" class="page" style="display:none"></div>
        <div id="tab-weight" class="page" style="display:none"></div>
        <div id="tab-history" class="page" style="display:none"></div>
        <div id="tab-settings" class="page" style="display:none"></div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div id="bottomnav" style="flex-shrink:0;background:rgba(3,7,18,.98);border-top:1px solid #1f2937;display:flex">
      <button class="nav-btn" onclick="goTab('profile')" id="nav-profile">
        <span style="font-size:18px">👤</span>
        <span style="font-size:8px;letter-spacing:.5px">PROFIL</span>
      </button>
      <button class="nav-btn" onclick="goTab('blocks')" id="nav-blocks">
        <span style="font-size:18px">🧱</span>
        <span style="font-size:8px;letter-spacing:.5px">BLOCS</span>
      </button>
      <button class="nav-btn" onclick="goTab('session')" id="nav-session">
        <span style="font-size:18px">🏋️</span>
        <span style="font-size:8px;letter-spacing:.5px">SÉANCE</span>
      </button>
      <button class="nav-btn" onclick="goTab('weight')" id="nav-weight">
        <span style="font-size:18px">⚖️</span>
        <span style="font-size:8px;letter-spacing:.5px">POIDS</span>
      </button>
      <button class="nav-btn" onclick="goTab('history')" id="nav-history">
        <span style="font-size:18px">📊</span>
        <span style="font-size:8px;letter-spacing:.5px">HISTO</span>
      </button>
      <button class="nav-btn" onclick="goTab('settings')" id="nav-settings">
        <span style="font-size:18px">⚙️</span>
        <span style="font-size:8px;letter-spacing:.5px">CONFIG</span>
      </button>
    </div>
  </div>

  <!-- REST TIMER WIDGET (floating) -->
  <div id="timer-widget" style="display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#111827;border:1.5px solid #4f46e5;border-radius:50px;padding:8px 14px 8px 8px;z-index:90;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:background .3s">
    <div style="position:relative;width:44px;height:44px;flex-shrink:0">
      <svg width="44" height="44" style="transform:rotate(-90deg)">
        <circle cx="22" cy="22" r="36" fill="none" stroke="#1f2937" stroke-width="4" transform="scale(0.5) translate(22,22)"/>
        <circle id="timer-ring" cx="22" cy="22" r="18" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#818cf8" id="timer-display">2:00</div>
    </div>
    <button onclick="toggleTimerPlayPause()" id="timer-playpause" style="background:#4f46e5;color:#fff;width:32px;height:32px;border-radius:50%;font-size:12px;flex-shrink:0">⏸</button>
    <button onclick="addTimerSeconds(15)" style="background:#1f2937;color:#818cf8;padding:6px 9px;border-radius:7px;font-size:10px;font-weight:600;flex-shrink:0">+15s</button>
    <button onclick="stopTimer()" style="background:transparent;color:#6b7280;font-size:14px;padding:4px 6px;flex-shrink:0">✕</button>
  </div>

  <!-- MODAL -->
  <div id="modal-overlay" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.85);z-index:100;align-items:flex-end;justify-content:center" onclick="closeModal()">
    <div id="modal-box" style="background:#111827;border-top:1.5px solid #818cf8;border-left:1.5px solid #818cf8;border-right:1.5px solid #818cf8;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- SAFE AREA BOTTOM -->
  <div id="safe-bottom"></div>

</div>

  2:{10:0.955,9.5:0.939,9:0.922,8.5:0.907,8:0.892,7.5:0.878,7:0.863,6.5:0.850,6:0.837},

  6:{10:0.837,9.5:0.824,9:0.811,8.5:0.798,8:0.785,7.5:0.773,7:0.762,6.5:0.750,6:0.738},
  7:{10:0.811,9.5:0.798,9:0.785,8.5:0.773,8:0.762,7.5:0.750,7:0.738,6.5:0.727,6:0.714},
  8:{10:0.785,9.5:0.773,9:0.762,8.5:0.750,8:0.738,7.5:0.727,7:0.714,6.5:0.702,6:0.690},
  9:{10:0.762,9.5:0.750,9:0.738,8.5:0.727,8:0.714,7.5:0.702,7:0.690,6.5:0.680,6:0.668},
  10:{10:0.738,9.5:0.727,9:0.714,8.5:0.702,8:0.690,7.5:0.680,7:0.668,6.5:0.656,6:0.645},
};
function calcE1RM(w,r,rpe){
  const row=RT[Math.min(Math.round(r),10)];
  if(!row)return w;
  const p=row[Math.round(rpe*2)/2];
  return p?Math.round(w/p):w;
}
function calcSuggest(e1rm,r,rpe){
  const row=RT[Math.min(Math.round(r),10)];
  if(!row)return null;
  const p=row[Math.round(rpe*2)/2];
  return p?Math.round((e1rm*p)/2.5)*2.5:null;
}

const rpeC=r=>RPE_COLOR[r]||"#94a3b8";
const LEVEL_COLOR={Débutant:"#22c55e",Intermédiaire:"#eab308",Avancé:"#ef4444",Spécial:"#a855f7","Mon Programme":"#818cf8"};

     {name:"Jour 3",label:"Squat pause / Bench",exs:[{l:"Squat Pause",s:4,r:4,rpe:6},{l:"Bench Press",s:6,r:4,rpe:6},{l:"Romanian DL",s:3,r:8,rpe:6}]},

function getExs(block,wk,di){
  const w=block.wp[wk],d=block.days[di];
  if(!w||!d)return[];
  return d.exs.map(ex=>({
    lift:ex.l,
    sets:Math.max(1,Math.round(ex.s*w.vm)),
    reps:ex.r,
    targetRpe:Math.min(10,Math.max(6,parseFloat((ex.rpe+w.ro).toFixed(1))))
  }));
}
function getBlock(){return BLOCKS.find(b=>b.id===STATE.activeId)||null;}
function getLastData(lift){
  for(let i=STATE.history.length-1;i>=0;i--)
    for(const ex of(STATE.history[i].exercises||[]))
      if(ex.lift===lift&&ex.weight&&ex.actualRpe)return ex;
  return null;
}
function getSugg(ex){
  const last=getLastData(ex.lift);
  if(last)return calcSuggest(calcE1RM(last.weight,last.reps||ex.reps,last.actualRpe),ex.reps,ex.targetRpe);
  if(STATE.e1rms[ex.lift])return calcSuggest(STATE.e1rms[ex.lift],ex.reps,ex.targetRpe);
  return null;
}

// ── PLATE CALCULATOR ─────────────────────────────────────────────────────────
// Plaques dispo (kg) — standard powerlifting, barre olympique 20kg
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
const PLATE_COLORS = {25:"#dc2626",20:"#3b82f6",15:"#eab308",10:"#22c55e",5:"#e5e7eb",2.5:"#1f2937",1.25:"#9ca3af"};
const BAR_WEIGHT = 20;

function calcPlates(totalWeight){
  const w = parseFloat(totalWeight);
  if(!w || w <= BAR_WEIGHT) return null;
  let perSide = (w - BAR_WEIGHT) / 2;
  if(perSide <= 0) return null;
  const result = [];
  for(const p of PLATES){
    while(perSide >= p - 0.001){
      result.push(p);
      perSide -= p;
    }
  }
  const remainder = Math.round(perSide*100)/100;
  return { plates: result, remainder, exact: remainder < 0.01 };
}

function plateCalcHTML(weight){
  const calc = calcPlates(weight);
  if(!calc) return "";
  if(calc.plates.length === 0) return `<div style="font-size:10px;color:#6b7280">Barre seule (${BAR_WEIGHT}kg)</div>`;
  const chips = calc.plates.map(p=>{
    const c = PLATE_COLORS[p]||"#6b7280";
    const textColor = (p===5||p===1.25) ? "#111827" : "#fff";
    return `<span style="background:${c};color:${textColor};border-radius:5px;padding:3px 7px;font-size:11px;font-weight:700;display:inline-block;margin:2px">${p}</span>`;
  }).join("");
  const warn = !calc.exact ? `<span style="color:#ef4444;font-size:9px;margin-left:6px">(reste ${calc.remainder}kg non chargeable)</span>` : "";
  return `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px">
    <span style="font-size:9px;color:#6b7280;margin-right:6px">Par côté:</span>${chips}${warn}
  </div>`;
}

// ── REST TIMER ────────────────────────────────────────────────────────────────
let TIMER = { running:false, seconds:0, interval:null, duration:120 };

function startTimer(seconds){
  clearInterval(TIMER.interval);
  TIMER.duration = seconds;
  TIMER.seconds = seconds;
  TIMER.running = true;
  updateTimerDisplay();
  TIMER.interval = setInterval(()=>{
    TIMER.seconds--;
    if(TIMER.seconds <= 0){
      clearInterval(TIMER.interval);
      TIMER.running = false;
      TIMER.seconds = 0;
      // Vibration + visual flash
      if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
      flashTimerDone();
    }
    updateTimerDisplay();
  }, 1000);
  showTimerWidget();
}

function pauseTimer(){
  clearInterval(TIMER.interval);
  TIMER.running = false;
  updateTimerDisplay();
}

function resumeTimer(){
  TIMER.running = true;
  TIMER.interval = setInterval(()=>{
    TIMER.seconds--;
    if(TIMER.seconds <= 0){
      clearInterval(TIMER.interval);
      TIMER.running = false;
      TIMER.seconds = 0;
      if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
      flashTimerDone();
    }
    updateTimerDisplay();
  }, 1000);
  updateTimerDisplay();
}

function stopTimer(){
  clearInterval(TIMER.interval);
  TIMER.running = false;
  TIMER.seconds = 0;
  hideTimerWidget();
}

function addTimerSeconds(delta){
  TIMER.seconds = Math.max(0, TIMER.seconds + delta);
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const el = document.getElementById("timer-display");
  if(!el) return;
  const m = Math.floor(TIMER.seconds/60);
  const s = TIMER.seconds%60;
  el.textContent = `${m}:${s<10?"0":""}${s}`;
  const ring = document.getElementById("timer-ring");
  if(ring){
    const pct = TIMER.duration > 0 ? TIMER.seconds/TIMER.duration : 0;
    const circumference = 2 * Math.PI * 36;
    ring.style.strokeDashoffset = circumference * (1-pct);
  }
  const playBtn = document.getElementById("timer-playpause");
  if(playBtn) playBtn.textContent = TIMER.running ? "⏸" : "▶";
}

function flashTimerDone(){
  const widget = document.getElementById("timer-widget");
  if(!widget) return;
  widget.style.background = "#16a34a";
  setTimeout(()=>{ if(widget) widget.style.background = "#111827"; }, 600);
  setTimeout(()=>{ if(widget) widget.style.background = "#16a34a"; }, 1200);
  setTimeout(()=>{ if(widget) widget.style.background = "#111827"; }, 1800);
}

function showTimerWidget(){
  const w = document.getElementById("timer-widget");
  if(w) w.style.display = "flex";
}
function hideTimerWidget(){
  const w = document.getElementById("timer-widget");
  if(w) w.style.display = "none";
}
window.startTimer = startTimer;
window.pauseTimer = pauseTimer;
window.resumeTimer = resumeTimer;
window.stopTimer = stopTimer;
window.addTimerSeconds = addTimerSeconds;
window.toggleTimerPlayPause = ()=>{ TIMER.running ? pauseTimer() : resumeTimer(); };

async function saveSession2(){
  const block=getBlock();
  if(!block||STATE.saving)return;
  STATE.saving=true;
  renderTab("session",renderSession);
  const exs=getExs(block,STATE.week,STATE.dayIdx).map((ex,i)=>{
    const lg=STATE.log[i]||{};
    const w=parseFloat(lg.weight)||getSugg(ex)||0;
    const rpe=parseFloat(lg.rpe)||ex.targetRpe;
    return{...ex,weight:w,actualRpe:rpe,e1rm:calcE1RM(w,ex.reps,rpe)};
  });
  const ne={...STATE.e1rms};
  exs.forEach(ex=>{if(ex.weight&&ex.actualRpe)ne[ex.lift]=Math.max(ne[ex.lift]||0,ex.e1rm);});
  const nh=[...STATE.history,{
    date:new Date().toLocaleDateString("fr-FR"),
    blockId:STATE.activeId,blockName:block.name,blockInspo:block.inspo,
    week:STATE.week+1,weekLabel:block.wp[STATE.week]?.lbl,
    day:block.days[STATE.dayIdx]?.name,exercises:exs,
  }];
  STATE.e1rms=ne;STATE.history=nh;STATE.log={};
  save("pl_hist",nh);save("pl_e1rm",ne);
  STATE.saving=false;STATE.saved=true;
  renderTab("session",renderSession);
  setTimeout(()=>{STATE.saved=false;renderTab("session",renderSession);},2500);
}

function addBodyweight(value, dateStr){
  const w = parseFloat(value);
  if(!w || w <= 0) return;
  const date = dateStr || new Date().toISOString().split("T")[0];
  // Remove existing entry for same date, then add
  STATE.bodyweight = STATE.bodyweight.filter(e=>e.date!==date);
  STATE.bodyweight.push({date, weight:w});
  STATE.bodyweight.sort((a,b)=>a.date.localeCompare(b.date));
  save("pl_bw", STATE.bodyweight);
  renderTab("weight", renderWeight);
}

    let minW = Math.min(...weights, 95) - 2;
    let maxW = Math.max(...weights, 100) + 2;
    const range = maxW - minW || 1;

    const xStep = (W - PAD*2) / Math.max(entries.length - 1, 1);
    const points = entries.map((e,i)=>{
      const x = PAD + i*xStep;
      const y = PAD + (H - PAD*2) * (1 - (e.weight - minW) / range);
      return {x, y, w:e.weight, date:e.date};
    });

    const pathD = points.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");

    points.forEach((p,i)=>{
      const isLast = i === points.length-1;
      svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?5:3}" fill="${isLast?'#f97316':'#818cf8'}" stroke="#111827" stroke-width="1.5"/>`;
    });

    svg += `</svg>`;
    graphCard.innerHTML += svg;

    // Legend
    graphCard.appendChild(div({display:"flex",gap:"14px",marginTop:"10px",fontSize:"10px",color:"#6b7280"},
      `<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;opacity:0.4;margin-right:4px"></span>Zone objectif (95-100kg)</span>

    root.appendChild(div({background:"#111827",border:"1px dashed #1f2937",borderRadius:"12px",padding:"30px 16px",textAlign:"center",marginBottom:"16px"},
      `<div style="font-size:28px;margin-bottom:8px">⚖️</div>
       <div style="color:#6b7280;font-size:12px">Ajoute au moins 2 pesées pour voir ton graphique de progression.</div>`));

  // ── History list ──
  if(entries.length > 0){

      const right = div({display:"flex",alignItems:"center",gap:"8px"});
      right.innerHTML = `<span style="font-size:15px;font-weight:700;color:#e2e8f0">${e.weight}kg</span>

      const delBtn = document.createElement("button");
      delBtn.textContent = "🗑️";
      Object.assign(delBtn.style,{background:"transparent",border:"none",color:"#ef4444",fontSize:"12px",padding:"4px 6px",marginLeft:"6px",opacity:"0.6"});
      delBtn.onclick = ()=>{

        renderTab("weight", renderWeight);
      };
      right.appendChild(delBtn);

      row.appendChild(left);
      row.appendChild(right);
      histCard.appendChild(row);
    });
    root.appendChild(histCard);
  }
}

// ── e1RM history from sessions ────────────────────────────────────────────────
function getE1rmHistory(lift){
  const points=[];
  STATE.history.forEach(s=>{
    (s.exercises||[]).forEach(ex=>{
      if(ex.lift===lift && ex.weight && ex.actualRpe && ex.e1rm){
        points.push({date:s.date, e1rm:ex.e1rm, weight:ex.weight, rpe:ex.actualRpe, reps:ex.reps, block:s.blockName});
      }
    });
  });
  // dedupe: garder le max e1RM par date
  const byDate={};
  points.forEach(p=>{ if(!byDate[p.date]||p.e1rm>byDate[p.date].e1rm) byDate[p.date]=p; });
  return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
}

function e1rmGraphSVG(points, color){
  if(points.length<2) return null;
  const W=600,H=160,PAD=28;
  const vals=points.map(p=>p.e1rm);
  const minV=Math.min(...vals)*0.95;
  const maxV=Math.max(...vals)*1.03;
  const range=maxV-minV||1;
  const xStep=(W-PAD*2)/Math.max(points.length-1,1);
  const pts=points.map((p,i)=>({
    x:PAD+i*xStep,
    y:PAD+(H-PAD*2)*(1-(p.e1rm-minV)/range),
    ...p
  }));
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaD=pathD+` L${pts[pts.length-1].x.toFixed(1)},${H-PAD} L${pts[0].x.toFixed(1)},${H-PAD} Z`;
  const gradId=`g${color.replace("#","")}`;
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaD}" fill="url(#${gradId})"/>
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    const isLast=i===pts.length-1;
    svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?5:3}" fill="${isLast?color:'#111827'}" stroke="${color}" stroke-width="2"/>`;
    if(isLast) svg+=`<text x="${Math.min(p.x+8,W-40)}" y="${p.y-8}" fill="${color}" font-size="11" font-weight="700">${p.e1rm}kg</text>`;
  });
  // Y axis labels
  svg+=`<text x="2" y="${PAD+4}" fill="#6b7280" font-size="9">${Math.round(maxV)}</text>`;
  svg+=`<text x="2" y="${H-PAD+4}" fill="#6b7280" font-size="9">${Math.round(minV)}</text>`;
  svg+=`</svg>`;
  return svg;
}

      const intercept=(sumY-slope*sumX)/n;
      const current=ys[ys.length-1];

      const row=div({background:"#0d1117",borderRadius:"10px",padding:"12px",marginBottom:"8px"});

      // Header lift
      row.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:7px">
          <span style="font-size:16px">${LIFT_EMOJI_P[lift]}</span>
          <div>
            <div style="font-size:12px;font-weight:700;color:${color}">${lift==="Bench Press"?"Bench Press":lift}</div>
            <div style="font-size:9px;color:#6b7280">Progression : <span style="color:${kgPerWeek>=0?"#22c55e":"#ef4444"};font-weight:700">${kgPerWeek>=0?"+":""}${kgPerWeek} kg/semaine</span></div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;color:${color}">${current}kg</div>
          <div style="font-size:9px;color:#6b7280">e1RM actuel</div>
        </div>
      </div>`;

      // Barres de prédiction
      const maxPred=Math.max(pred3m,pred6m,pred12m,current);
      const minPred=Math.min(current)*0.95;
      const predRange=maxPred-minPred||1;

      [[pred3m,gain3m,"3 mois"],[pred6m,gain6m,"6 mois"],[pred12m,gain12m,"12 mois"]].forEach(([pred,gain,label])=>{
        const pct=Math.max(0,Math.min(100,((pred-minPred)/predRange)*100));
        const gc=gain>=0?"#22c55e":"#ef4444";
        const predRow=div({marginBottom:"6px"});
        predRow.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
          <span style="font-size:10px;color:#6b7280">${label}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11px;font-weight:700;color:#e2e8f0">${pred>0?pred:"—"}kg</span>
            <span style="font-size:10px;font-weight:700;color:${gc}">${gain>=0?"+":""}${gain}kg</span>
          </div>
        </div>
        <div style="background:#1f2937;border-radius:4px;height:6px;overflow:hidden">
          <div style="background:linear-gradient(90deg,${color}80,${color});height:100%;width:${pct}%;border-radius:4px;transition:width .5s"></div>
        </div>`;
        row.appendChild(predRow);
      });

      // Avertissement si pas assez de données
      if(pts.length<5){
        const warn=div({marginTop:"8px",padding:"7px 10px",background:"rgba(234,179,8,.08)",borderLeft:"3px solid #eab308",borderRadius:"5px"});
        warn.innerHTML=`<div style="font-size:10px;color:#eab308">⚠️ Prédiction peu fiable — ${pts.length} mesure${pts.length>1?"s":""} seulement. Plus tu enregistres de séances, plus la prédiction sera précise.</div>`;
        row.appendChild(warn);
      }

      predCard.appendChild(row);
    });

    if(!hasPredData){
      predCard.appendChild(div({fontSize:"11px",color:"#6b7280",textAlign:"center",padding:"16px"},
        "Pas encore assez de données.\nEnregistre au moins 2 séances par mouvement pour voir les prédictions."));
    } else {
      // Note méthodologique
      predCard.appendChild(div({fontSize:"9px",color:"#374151",marginTop:"8px",padding:"8px",background:"#0d1117",borderRadius:"6px",lineHeight:"1.5"},
        "💡 Prédiction basée sur une régression linéaire de ton historique e1RM. Les gains réels peuvent varier selon la récupération, la nutrition et l'intensité des blocs."));
    }

    root.appendChild(predCard);

    return;
  }

  // ── TAB : BLOCS ──
  if(HIST_TAB==="blocs"){
    root.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#818cf8",marginBottom:"4px"},"📊 COMPARATEUR DE BLOCS"));
    root.appendChild(div({fontSize:"10px",color:"#6b7280",marginBottom:"14px"},"Compare tes e1RM au début et à la fin de chaque bloc complété."));

    // Récupère tous les blocs uniques dans l'historique
    const blocIds=[...new Set(STATE.history.map(s=>s.blockId))].filter(Boolean);

    if(!blocIds.length){
      root.appendChild(div({background:"#111827",border:"1px dashed #1f2937",borderRadius:"12px",padding:"40px 16px",textAlign:"center"},
        `<div style="font-size:28px;margin-bottom:10px">📊</div>
         <div style="color:#6b7280;font-size:12px">Aucun bloc enregistré.<br>Commence à t'entraîner pour voir la comparaison.</div>`));
      return;
    }

    const LIFTS_C=["Squat","Bench Press","Deadlift"];

    blocIds.forEach(blockId=>{
      const blockSessions=STATE.history.filter(s=>s.blockId===blockId);
      if(!blockSessions.length) return;

      const bt=BLOCKS.find(b=>b.id===blockId);
      const color=bt?.color||"#818cf8";
      const emoji=bt?.emoji||"📦";
      const name=bt?.name||blockId;

      // Semaines présentes
      const weeks=[...new Set(blockSessions.map(s=>s.week))].sort((a,b)=>a-b);
      const firstWeek=weeks[0], lastWeek=weeks[weeks.length-1];

      // e1RM par mouvement : première semaine vs dernière semaine
      const firstSessions=blockSessions.filter(s=>s.week===firstWeek);
      const lastSessions=blockSessions.filter(s=>s.week===lastWeek);

      function bestE1rmInSessions(sessions, lift){
        let best=0;
        sessions.forEach(s=>(s.exercises||[]).forEach(ex=>{
          if(ex.lift===lift && ex.e1rm && ex.e1rm>best) best=ex.e1rm;
        }));
        return best||null;
      }

      const card=div({background:"#111827",border:`1.5px solid ${color}30`,borderRadius:"12px",padding:"16px",marginBottom:"14px"});

      // Header
      card.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <span style="font-size:20px">${emoji}</span>
        <div>
          <div style="font-size:14px;font-weight:700;color:${color}">${name}</div>
          <div style="font-size:10px;color:#6b7280">S${firstWeek} → S${lastWeek} · ${blockSessions.length} séance${blockSessions.length>1?"s":""}</div>
        </div>
      </div>`;

      // Tableau comparatif
      const table=div({background:"#0d1117",borderRadius:"8px",overflow:"hidden",marginBottom:"10px"});

      // Header table
      table.innerHTML=`<div style="display:grid;grid-template-columns:1fr 80px 80px 70px;gap:0;padding:7px 10px;background:#1f2937">
        <div style="font-size:9px;color:#6b7280;letter-spacing:1px">MOUVEMENT</div>
        <div style="font-size:9px;color:#6b7280;text-align:center">DÉBUT</div>
        <div style="font-size:9px;color:#6b7280;text-align:center">FIN</div>
        <div style="font-size:9px;color:#6b7280;text-align:center">GAIN</div>
      </div>`;

      let hasData=false;
      LIFTS_C.forEach((lift,i)=>{
        const start=bestE1rmInSessions(firstSessions,lift);
        const end=bestE1rmInSessions(lastSessions,lift);
        if(!start && !end) return;
        hasData=true;
        const gain=(start&&end)?(end-start):null;
        const gainColor=gain===null?"#6b7280":gain>0?"#22c55e":gain<0?"#ef4444":"#6b7280";

        const row=div({display:"grid",gridTemplateColumns:"1fr 80px 80px 70px",gap:0,padding:"9px 10px",borderTop:"1px solid #1f2937"});
        row.innerHTML=`<div style="font-size:12px;color:#d1d5db;font-weight:600">${lift==="Bench Press"?"Bench":lift}</div>
          <div style="font-size:12px;color:#6b7280;text-align:center">${start?start+"kg":"—"}</div>
          <div style="font-size:12px;color:${color};font-weight:700;text-align:center">${end?end+"kg":"—"}</div>
          <div style="font-size:12px;font-weight:800;color:${gainColor};text-align:center">${gain!==null?(gain>=0?"+":"")+gain+"kg":"—"}</div>`;
        table.appendChild(row);
      });

      if(!hasData){
        table.innerHTML+=`<div style="padding:12px;font-size:11px;color:#4b5563;text-align:center">Pas assez de données pour comparer.</div>`;
      }
      card.appendChild(table);

      // Total gain
      const totalGains=LIFTS_C.map(lift=>{
        const s=bestE1rmInSessions(firstSessions,lift);
        const e=bestE1rmInSessions(lastSessions,lift);
        return(s&&e)?(e-s):0;
      });
      const totalGain=totalGains.reduce((a,b)=>a+b,0);

      if(hasData&&totalGain!==0){
        card.appendChild(div({
          display:"flex",justifyContent:"space-between",alignItems:"center",
          padding:"10px 12px",background:`${color}12`,borderRadius:"8px",
        },`<span style="font-size:11px;color:#6b7280;font-weight:600">Gain total sur le bloc</span>
           <span style="font-size:16px;font-weight:800;color:${totalGain>0?"#22c55e":"#ef4444"}">${totalGain>0?"+":""}${totalGain} kg</span>`));
      }

      root.appendChild(card);
    });

    // Comparaison globale entre blocs si plusieurs blocs
    if(blocIds.length>=2){
      const summaryCard=div({background:"#111827",border:"1px solid #4f46e530",borderRadius:"12px",padding:"16px",marginBottom:"14px"});
      summaryCard.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#818cf8",marginBottom:"12px"}),"🔄 PROGRESSION GLOBALE");

      LIFTS_C.forEach(lift=>{
        const allE1rms=[];
        STATE.history.forEach(s=>(s.exercises||[]).forEach(ex=>{
          if(ex.lift===lift&&ex.e1rm) allE1rms.push({week:s.week,blockId:s.blockId,date:s.date,e1rm:ex.e1rm});
        }));
        if(allE1rms.length<2) return;
        allE1rms.sort((a,b)=>a.date.localeCompare(b.date));
        const first=allE1rms[0], last=allE1rms[allE1rms.length-1];
        const gain=last.e1rm-first.e1rm;

        const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1f2937"});
        row.innerHTML=`<span style="font-size:12px;color:#d1d5db;font-weight:600">${lift==="Bench Press"?"Bench":lift}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:11px;color:#6b7280">${first.e1rm}kg</span>
            <span style="color:#374151">→</span>
            <span style="font-size:13px;font-weight:700;color:#818cf8">${last.e1rm}kg</span>
            <span style="font-size:12px;font-weight:800;color:${gain>=0?"#22c55e":"#ef4444"}">${gain>=0?"+":""}${gain}kg</span>
          </div>`;
        summaryCard.appendChild(row);
      });
      root.appendChild(summaryCard);
    }

    return;
  }

  // ── TAB : SÉANCES ──
  const lifts=["Squat","Bench Press","Deadlift"].filter(l=>STATE.e1rms[l]);
  if(lifts.length){
    const grid=div({display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px",marginBottom:"16px"});
    lifts.forEach(l=>{
      grid.appendChild(div({background:"#111827",border:"1px solid #1f2937",borderRadius:"10px",padding:"12px",textAlign:"center"},
        `<div style="font-size:10px;color:#6b7280;letter-spacing:1px">${l==="Bench Press"?"BENCH":l.toUpperCase()}</div>
         <div style="font-size:22px;font-weight:800;color:#818cf8;margin-top:2px">${STATE.e1rms[l]}<span style="font-size:13px">kg</span></div>
         <div style="font-size:9px;color:#4b5563">e1RM max</div>`));
    });
    root.appendChild(grid);
  }

  if(!STATE.history.length){
    root.appendChild(div({background:"#111827",border:"1px solid #1f2937",borderRadius:"12px",padding:"40px 16px",textAlign:"center"},
      `<div style="font-size:32px;margin-bottom:10px">📋</div><div style="color:#6b7280;font-size:13px">Aucune séance enregistrée.</div>`));
    return;
  }

  [...STATE.history].map((s,realIdx)=>({s,realIdx})).reverse().forEach(({s,realIdx})=>{
    const bt=BLOCKS.find(b=>b.id===s.blockId);
    const card=div({background:"#111827",border:"1px solid #1f2937",borderRadius:"12px",padding:"14px",marginBottom:"8px"});
    const hdr=div({display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px",gap:"8px"});
    const hdrLeft=div({display:"flex",alignItems:"center",gap:"8px",flex:"1",minWidth:"0"});
    hdrLeft.innerHTML=`
      <span style="font-size:16px;flex-shrink:0">${bt?.emoji||"📋"}</span>
      <div style="min-width:0">
        <div style="font-size:13px;font-weight:700;color:${bt?.color||"#818cf8"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.blockName} — S${s.week} ${s.weekLabel||""}</div>
        <div style="font-size:10px;color:#6b7280">${s.day||""} · ${s.date}</div>
      </div>`;
    const confirmZone=div({display:"none",alignItems:"center",gap:"6px",marginTop:"8px",padding:"8px",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:"8px"});
    confirmZone.innerHTML=`<span style="font-size:11px;color:#ef4444;flex:1">Supprimer cette séance ?</span>`;
    const btnOui=document.createElement("button");
    btnOui.textContent="Oui";
    Object.assign(btnOui.style,{background:"#ef4444",border:"none",color:"#fff",padding:"5px 12px",borderRadius:"6px",fontSize:"12px",fontWeight:"700"});
    btnOui.onclick=()=>{STATE.history.splice(realIdx,1);save("pl_hist",STATE.history);renderTab("history",renderHistory);};
    const btnNon=document.createElement("button");
    btnNon.textContent="Non";
    Object.assign(btnNon.style,{background:"#374151",border:"none",color:"#e2e8f0",padding:"5px 12px",borderRadius:"6px",fontSize:"12px"});
    btnNon.onclick=()=>{confirmZone.style.display="none";delOne.style.opacity="1";};
    confirmZone.appendChild(btnOui);confirmZone.appendChild(btnNon);
    const delOne=document.createElement("button");
    delOne.textContent="🗑️";
    Object.assign(delOne.style,{background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.3)",color:"#ef4444",padding:"5px 9px",borderRadius:"7px",fontSize:"14px",flexShrink:"0"});
    delOne.onclick=()=>{confirmZone.style.display="flex";delOne.style.opacity="0.4";};
    hdr.appendChild(hdrLeft);hdr.appendChild(delOne);
    card.appendChild(hdr);card.appendChild(confirmZone);
    (s.exercises||[]).forEach((ex,j)=>{
      const row=div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderTop:"1px solid #1f2937",fontSize:"12px",gap:"6px"});
      row.innerHTML=`<span style="color:#d1d5db;flex:1">${ex.lift}</span>
        <span style="color:#e2e8f0;font-weight:600">${ex.weight}kg×${ex.reps}</span>
        <span style="background:${rpeC(ex.actualRpe)}18;color:${rpeC(ex.actualRpe)};padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600">RPE ${ex.actualRpe}</span>
        <span style="color:#818cf8;font-size:11px">e1RM ${ex.e1rm}kg</span>`;
      card.appendChild(row);
    });
    root.appendChild(card);
  });

  const delBtn=btn("🗑️ Effacer tout l'historique",{marginTop:"8px",background:"#1f2937",border:"1px solid #991b1b",color:"#ef4444",padding:"8px 16px",borderRadius:"8px",fontSize:"12px"},()=>{
    if(confirm("Effacer tout l'historique ?")){STATE.history=[];STATE.e1rms={};save("pl_hist",[]);save("pl_e1rm",{});renderTab("history",renderHistory);}
  });
  root.appendChild(delBtn);
}

// ── SETTINGS TAB ─────────────────────────────────────────────────────────────
function renderSettings(root){
  root.appendChild(div({fontSize:"18px",fontWeight:"800",letterSpacing:"2px",marginBottom:"16px"},"CONFIGURATION"));

  // Storage info
  root.appendChild(div({background:"#052e16",border:"1px solid #166534",borderRadius:"10px",padding:"12px 14px",marginBottom:"12px"},
    `<div style="display:flex;align-items:center;gap:10px">
       <div style="width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 8px #22c55e"></div>
       <div>
         <div style="font-size:13px;font-weight:700;color:#22c55e">Stockage local actif</div>
         <div style="font-size:11px;color:#166534;margin-top:2px">Données sauvegardées sur cet appareil. Reste dans Safari si tu ajoutes le fichier à l'écran d'accueil.</div>
       </div>
     </div>`));

  // e1RM
  const eCard=div({background:"#111827",border:"1px solid #1f2937",borderRadius:"12px",padding:"16px",marginBottom:"12px"});
  eCard.appendChild(div({fontSize:"13px",fontWeight:"700",color:"#818cf8",marginBottom:"4px"},"🏆 Maximas (e1RM)"));
  eCard.appendChild(div({fontSize:"11px",color:"#6b7280",marginBottom:"12px"},"Entre tes maximas pour calibrer les suggestions dès le départ."));
  ["Squat","Bench Press","Deadlift"].forEach(l=>{
    const row=div({display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"});
    row.appendChild(div({color:"#d1d5db",fontSize:"13px",flex:"1"},l));
    const inp=document.createElement("input");
    inp.type="number";inp.step="2.5";inp.value=STATE.e1rms[l]||"";inp.placeholder="kg";
    Object.assign(inp.style,{width:"80px",background:"#0d1117",border:"1px solid #374151",borderRadius:"8px",color:"#e2e8f0",padding:"8px 10px",fontSize:"15px",fontWeight:"600"});
    inp.oninput=e=>{STATE.e1rms[l]=parseFloat(e.target.value)||0;save("pl_e1rm",STATE.e1rms);};
    row.appendChild(inp);
    row.appendChild(div({color:"#4b5563",fontSize:"12px"},"kg"));
    eCard.appendChild(row);
  });
  root.appendChild(eCard);

  // RPE guide
  const rCard=div({background:"#111827",border:"1px solid #1f2937",borderRadius:"12px",padding:"16px",marginBottom:"12px"});
  rCard.appendChild(div({fontSize:"13px",fontWeight:"700",color:"#818cf8",marginBottom:"12px"},"📖 Guide RPE (Tuchscherer)"));
  [[6,"4+ reps — Échauffement"],[6.5,"3-4 reps — Très facile"],[7,"3 reps — Modéré"],[7.5,"2-3 reps — Confortable"],[8,"2 reps — Difficile"],[8.5,"1-2 reps — Très difficile"],[9,"1 rep — Presque max"],[9.5,"0-1 rep — Proche du max"],[10,"0 rep — Maximum absolu"]].forEach(([r,d])=>{
    const row=div({display:"flex",alignItems:"center",gap:"10px",padding:"5px 0",borderBottom:"1px solid #1f2937"});
    row.innerHTML=`<span style="background:${rpeC(r)}18;color:${rpeC(r)};padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;min-width:36px;text-align:center">${r}</span>
      <span style="font-size:12px;color:#6b7280">${d}</span>`;
    rCard.appendChild(row);
  });
  rCard.appendChild(div({marginTop:"12px",padding:"12px",background:"#0d1117",borderRadius:"8px",fontSize:"11px",color:"#6b7280",lineHeight:"1.7"},
    "💡 <strong style='color:#9ca3af'>Autorégulation :</strong> L'app calcule ton e1RM estimé à chaque séance. Si ton RPE réel dépasse la cible, le poids suggéré est réduit automatiquement — et inversement."));
  root.appendChild(rCard);

  // Block list
  const bCard=div({background:"#111827",border:"1px solid #1f2937",borderRadius:"12px",padding:"16px"});
  bCard.appendChild(div({fontSize:"13px",fontWeight:"700",color:"#818cf8",marginBottom:"12px"},"🏆 Les 10 programmes"));
  BLOCKS.forEach(b=>{
    const lc=LEVEL_COLOR[b.level]||"#818cf8";
    const row=div({display:"flex",alignItems:"center",gap:"10px",padding:"8px 0",borderBottom:"1px solid #1f2937"});
    row.innerHTML=`<span style="font-size:16px">${b.emoji}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;color:${b.color}">${b.name}</div>
        <div style="font-size:10px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">(${b.inspo})</div>
      </div>
      <span style="background:${lc}20;border:1px solid ${lc}40;color:${lc};border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;flex-shrink:0">${b.level}</span>`;
    bCard.appendChild(row);
  });
  root.appendChild(bCard);
}

      <span style="font-size:28px">${b.emoji}</span>

        <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
          <span style="background:${lc}20;border:1px solid ${lc}40;color:${lc};border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">${b.level}</span>
          <span style="background:${b.color}20;border:1px solid ${b.color}40;color:${b.color};border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">${b.weeks} semaines</span>
          <span style="background:#6b728020;border:1px solid #6b728040;color:#6b7280;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600">3j / sem</span>
        </div>
      </div>
    </div>
    <div style="font-size:13px;color:#9ca3af;line-height:1.7;margin-bottom:${b.notes?'10px':'16px'};padding:12px;background:#0d1117;border-radius:8px;border-left:3px solid ${b.color}60">${b.desc}</div>

    <div style="font-size:11px;color:#6b7280;letter-spacing:2px;margin-bottom:8px">STRUCTURE</div>

  b.wp.forEach((w,i)=>{
    const bg=w.ro>0?"#450a0a":w.ro<0?"#052e16":"#1e1b4b";
    const bc=w.ro>0?"#991b1b":w.ro<0?"#166534":"#3730a3";
    const tc=w.ro>0?"#ef4444":w.ro<0?"#22c55e":"#818cf8";
    html+=`<div style="background:${bg};border:1px solid ${bc};border-radius:8px;padding:8px 10px;text-align:center;flex-shrink:0;min-width:64px">
      <div style="font-size:9px;color:#6b7280">S${i+1}</div>
      <div style="font-size:11px;color:#e2e8f0;margin-top:1px">${w.lbl}</div>
      <div style="font-size:9px;color:${tc};margin-top:2px">${w.ro>0?"+":""}${w.ro!==0?"RPE"+w.ro:"Base"} ×${w.vm}</div>
    </div>`;
  });
  html+=`</div><div style="font-size:11px;color:#6b7280;letter-spacing:2px;margin-bottom:8px">JOURS</div>`;
  b.days.forEach(d=>{
    html+=`<div style="background:#0d1117;border:1px solid #1f2937;border-radius:8px;padding:12px;margin-bottom:6px">
      <div style="font-size:12px;font-weight:600;color:${b.color};margin-bottom:8px">${d.name} — ${d.label}</div>`;
    d.exs.forEach((ex,ei)=>{
      html+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;${ei>0?"border-top:1px solid #1f2937":""}">
        <span style="color:#d1d5db">${ex.l}</span>
        <span style="color:${rpeC(ex.rpe)};font-weight:600">${ex.s}×${ex.r} @ RPE ${ex.rpe}</span>
      </div>`;
    });
    html+=`</div>`;
  });
  content.innerHTML=html;
  // Use button
  const useBtn=btn("▶ UTILISER CE BLOC",{marginTop:"12px",width:"100%",background:b.color,border:"none",color:"#fff",padding:"14px",borderRadius:"10px",fontSize:"13px",fontWeight:"700",letterSpacing:"1px"},()=>{
    STATE.activeId=b.id;STATE.week=0;STATE.dayIdx=0;STATE.log={};
    save("pl_st",{id:b.id,week:0,day:0});
    closeModal();goTab("session");
  });
  content.appendChild(useBtn);
  overlay.style.display="flex";
}
function closeModal(){document.getElementById("modal-overlay").style.display="none";}
window.closeModal=closeModal;

// ── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded",()=>{
  load();
  setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    const main=document.getElementById("main");
    main.style.display="flex";
    render();
  },600);
});
</script>
</body>
